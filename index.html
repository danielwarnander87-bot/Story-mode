    }},
  ]},

{ id:'expressauthority', title:'WHAT THE<br>CONTRACT SAYS', hook:"The agent contract as express authority.", icon:'📝', mood:'mood-bureau', tag:'ws67 · Agent Express Authority',
  endRule:"Express authority is whatever the written agent contract explicitly says the agent can or cannot do. Implied authority covers reasonable extensions of that; apparent authority is about third-party perception.",
  beats:[
    { speaker:'NARRATOR', text:"A new agent signs a contract with an insurance company, spelling out exactly what they can and can't do.", enter(S){
        S.mood('mood-bureau'); S.icon('main','📝',{label:'Agent Contract'});
    }},
    { speaker:'AGENT', text:"\"So this contract is the final word on my authority?\"", enter(S){
        S.icon('secondary','📄',{label:'Written Authority'});
    }},
    { speaker:'NARRATOR', text:"For what's written in it — yes. That's express authority: whatever the contract explicitly grants or denies.", enter(S){
        S.stamp('secondary','check','EXPRESS AUTHORITY');
        S.flash('WRITTEN = EXPRESS','var(--safe)');
    }},
    { speaker:'NARRATOR', text:"Implied authority picks up things reasonably necessary but not specifically written down. Apparent authority is about what a third party would reasonably believe, based on the insurer's own conduct.", enter(S){
        S.icon('secondary','🤔',{label:'Implied & Apparent — Different Categories'});
    }},
  ]},

{ id:'lossofuse', title:'THE LOSS THAT<br>BELONGS TO PROPERTY', hook:"Loss of use sits under property damage, not bodily injury.", icon:'🚗', mood:'mood-warning', tag:'ws68 · PAP Bodily Injury Definition',
  endRule:"Loss of use belongs under the PAP's property damage definition, not bodily injury. Death, sickness, and bodily harm are the actual components of bodily injury.",
  beats:[
    { speaker:'NARRATOR', text:"A claims adjuster is walking through the Personal Auto Policy's definitions section, sorting terms into categories.", enter(S){
        S.mood('mood-warning'); S.icon('main','📖',{label:'PAP Definitions'});
    }},
    { speaker:'NARRATOR', text:"Death, sickness, bodily harm — all filed neatly under bodily injury. That part's straightforward.", enter(S){
        S.icon('secondary','🩹',{label:'Bodily Injury Definition'});
        S.stamp('secondary','check','CORRECTLY FILED');
    }},
    { speaker:'ADJUSTER', text:"\"And loss of use — that goes here too, right? It's about someone being harmed.\"", enter(S){
        S.icon('secondary','🚙',{label:'Loss of Use', anim:'punch'});
    }},
    { speaker:'NARRATOR', text:"Wrong file. Loss of use belongs under PROPERTY damage — it's what applies when a car sits undrivable during repairs, not something that happens to a person.", enter(S){
        S.stamp('secondary','x','WRONG CATEGORY');
        S.flash('LOSS OF USE = PROPERTY DAMAGE','var(--danger)');
    }},
  ]},

{ id:'punitivedamages', title:'THE DAMAGE<br>THAT DOESN\'T PAY', hook:"Employer Liability covers defense costs only.", icon:'🚫', mood:'mood-stormred', tag:'ws69 · Workers\' Comp Part Two',
  endRule:"Part Two, Employer Liability, provides defense costs only — it does not cover actual benefits or punitive damages awarded to an employee. Punitive damages are rarely covered by any insurance policy.",
  beats:[
    { speaker:'NARRATOR', text:"An employer is sued directly, on top of a standard Workers' Comp claim — the suit seeks punitive damages.", enter(S){
        S.mood('mood-stormred'); S.icon('main','⚖️',{label:'Employer Sued Directly'});
    }},
    { speaker:'EMPLOYER', text:"\"Part Two, Employer Liability — that'll cover the punitive damages if I lose, right?\"", enter(S){
        S.icon('secondary','💰',{label:'Punitive Damages?', anim:'punch'});
    }},
    { speaker:'NARRATOR', text:"No. Employer Liability only pays defense costs — the cost of defending the suit, not any actual damages awarded.", enter(S){
        S.stamp('secondary','x','DEFENSE COSTS ONLY');
    }},
    { speaker:'NARRATOR', text:"And punitive damages specifically? Those are rarely covered under ANY insurance policy — this one included.", enter(S){
        S.flash('PUNITIVE DAMAGES: NOT COVERED','var(--danger)');
    }},
    { speaker:'NARRATOR', text:"Everything else about Workers' Comp still holds true elsewhere: unlimited medical, disability capped at 2/3 of wages, and death benefits ending on remarriage with a final lump sum.", enter(S){}},
  ]},

{ id:'cplendorsement', title:'THE LIABILITY<br>THAT NEVER COMES FREE', hook:"Comprehensive Personal Liability on a DP policy.", icon:'📋', mood:'mood-warmnight', tag:'ws70 · DP Comprehensive Personal Liability',
  endRule:"No Dwelling Property form includes liability coverage automatically — not even DP-3. Comprehensive Personal Liability has to be added by endorsement, for extra premium, and it covers both on and off premises.",

        S.icon('secondary','🛡️',{label:'Assumed Included', anim:'punch'});

    { speaker:'NARRATOR', text:"Not true — no Dwelling Property form includes liability automatically. Not DP-1, not DP-2, not even DP-3.", enter(S){
        S.stamp('secondary','x','NOT AUTOMATIC — ANY FORM');
    }},
    { speaker:'NARRATOR', text:"Comprehensive Personal Liability has to be added by endorsement, for an extra premium — and once added, it covers her both ON and OFF the premises.", enter(S){
        S.icon('secondary','📝',{label:'Endorsed for Extra Premium', anim:'glowgold'});
        S.flash('ADD-ON, NOT AUTOMATIC','var(--safe)');

{ id:'growingcrops', title:'THE FIELD THAT<br>NEEDS ITS OWN POLICY', hook:"Farm property excludes growing crops.", icon:'🌾', mood:'mood-warning', tag:'ws71 · Farm Property Exclusion',
  endRule:"A Farm property policy covers silos, tractors, and livestock — but growing crops are excluded and picked up by a separate line called crop insurance instead.",
  beats:[
    { speaker:'NARRATOR', text:"A farmer walks his agent through everything on the property — the silo, the tractor, the herd of livestock.", enter(S){
        S.mood('mood-warning'); S.icon('main','🚜',{label:'Farm Property'});
    }},
    { speaker:'NARRATOR', text:"Silo storing grain — covered. Tractor — covered. Livestock — covered. All part of the physical operation of the farm.", enter(S){
        S.icon('secondary','🐄',{label:'Structures, Machinery, Animals'});
        S.stamp('secondary','check','ALL COVERED');
    }},
    { speaker:'FARMER', text:"\"And the wheat still out in the field, growing?\"", enter(S){
        S.icon('secondary','🌾',{label:'Growing Crops', anim:'shatter'});
    }},
    { speaker:'NARRATOR', text:"That one falls outside the Farm property policy entirely — it needs its own separate product: crop insurance.", enter(S){

{ id:'catastrophicexposure', title:'THE LOSS TOO<br>BIG TO INSURE', hook:"Catastrophic exposure isn\'t an insurable element.", icon:'🌊', mood:'mood-stormred', tag:'ws72 · Elements of Insurable Risk',
  endRule:"A catastrophic exposure is the opposite of insurable — losses like war, earthquake, and flood get excluded because the scale can't be reasonably measured. Real insurable elements: accidental, definite/definable, and the law of large numbers applying.",
  beats:[
    { speaker:'NARRATOR', text:"A student is memorizing the checklist for what makes a risk insurable in the first place.", enter(S){
        S.mood('mood-stormred'); S.icon('main','📋',{label:'Insurable Risk Checklist'});
    }},
    { speaker:'NARRATOR', text:"The loss must be accidental. It must be definite and definable. The law of large numbers has to apply.", enter(S){
        S.icon('secondary','✅',{label:'Three Real Elements'});
        S.stamp('secondary','check','ACCIDENTAL / DEFINABLE / LARGE NUMBERS');
    }},
    { speaker:'STUDENT', text:"\"And a catastrophic exposure — that's an element too, right? Big losses need insurance most.\"", enter(S){
        S.icon('secondary','🌊',{label:'Catastrophic Exposure?', anim:'punch'});
    }},
    { speaker:'NARRATOR', text:"Backwards. Catastrophic perils like war, earthquake, and flood are the OPPOSITE of insurable — the scale of the loss can't be reasonably measured or spread.", enter(S){
        S.flash('CATASTROPHIC = EXCLUDED, NOT INSURABLE','var(--danger)');
    }},
  ]},

{ id:'attorneyinfact', title:'THE TITLE THAT<br>SOUNDS LEGAL BUT ISN\'T', hook:"The reciprocal exchange\'s attorney-in-fact.", icon:'🏛️', mood:'mood-bureau', tag:'ws73 · Reciprocal Exchange Management',
  endRule:"A reciprocal exchange, similar to a mutual insurer, is managed by an attorney-in-fact — a fixed, specific title, not a legal-sounding decoy like \"attorney-ex-officio.\"",
  beats:[
    { speaker:'NARRATOR', text:"A student is sorting through insurer types — stock, mutual, and now a reciprocal exchange.", enter(S){
        S.mood('mood-bureau'); S.icon('main','🏛️',{label:'Reciprocal Exchange'});
    }},
    { speaker:'STUDENT', text:"\"Who runs a reciprocal — some kind of attorney-ex-officio?\"", enter(S){
        S.icon('secondary','⚖️',{label:'Attorney-Ex-Officio?', anim:'punch'});
    }},
    { speaker:'NARRATOR', text:"That's not a real title — it just sounds legal enough to be tempting. The actual title is a fixed two-word phrase.", enter(S){
        S.stamp('secondary','x','NOT A REAL TERM');
    }},
    { speaker:'NARRATOR', text:"Attorney-in-fact — functionally the CEO of a reciprocal exchange, managing it similar to how a mutual insurer is run.", enter(S){
        S.icon('secondary','🖋️',{label:'Attorney-in-Fact', anim:'glowgold'});
        S.flash('ATTORNEY-IN-FACT = THE MANAGER','var(--safe)');
    }},
  ]},

{ id:'brokerrepresents', title:'THE CHAIN OF<br>WHO REPRESENTS WHOM', hook:"Broker represents the applicant.", icon:'🔗', mood:'mood-warmnight', tag:'ws74 · Distribution Channels',
  endRule:"Agent represents the company, solicitor represents the agent, broker represents the applicant — a clean chain worth memorizing as a whole rather than as isolated facts.",
  beats:[
    { speaker:'NARRATOR', text:"A customer is shopping for insurance and sits down with three different types of professionals.", enter(S){
        S.mood('mood-warmnight'); S.icon('main','🔗',{label:'Three Roles, Three Loyalties'});
    }},
    { speaker:'NARRATOR', text:"The agent she meets first works FOR the insurance company — that's who they represent.", enter(S){
        S.icon('secondary','🏢',{label:'Agent → Company'});
    }},
    { speaker:'NARRATOR', text:"The solicitor she talks to next works FOR that agent, not the company directly.", enter(S){
        S.icon('secondary','👤',{label:'Solicitor → Agent'});
    }},
    { speaker:'CUSTOMER', text:"\"And the broker I called to shop around — who does THEY work for?\"", enter(S){
        S.icon('secondary','🔍',{label:'Broker\'s Loyalty?', anim:'punch'});
    }},
    { speaker:'NARRATOR', text:"The broker is the one working for HER — the applicant. The only one of the three actually on the customer's side of the table.", enter(S){
        S.stamp('secondary','check','BROKER → APPLICANT');
        S.flash('THE CUSTOMER\'S OWN REPRESENTATIVE','var(--safe)');
    }},
  ]},

{ id:'dp1rental', title:'THE 20% CARVED<br>FROM THE DWELLING', hook:"DP-1 rental value coverage math.", icon:'🏠', mood:'mood-industrial', tag:'ws75 · DP-1 Rental Value',
  endRule:"Under a DP-1, the insured can apply up to 20% of the DWELLING coverage amount (not the whole policy, not contents) toward rental value — and using it reduces the dwelling limit left for actual repair.",
  beats:[
    { speaker:'NARRATOR', text:"A rental property is insured on a DP-1: $60,000 on the dwelling, $30,000 on contents.", enter(S){
        S.mood('mood-industrial'); S.icon('main','🏠',{label:'DP-1: $60K Dwelling / $30K Contents'});
    }},
    { speaker:'NARRATOR', text:"A covered loss forces the tenants out. The landlord loses rent while repairs happen.", enter(S){
        S.shake(); S.icon('secondary','📉',{label:'Lost Rental Income', anim:'punch'});
        S.banner('💸 RENT INTERRUPTED!','TENANTS DISPLACED BY LOSS');
    }},
    { speaker:'LANDLORD', text:"\"How much of my policy can I apply toward the rent I'm losing?\"", enter(S){
        S.icon('secondary','🧮',{label:'Rental Value Question'});
    }},
    { speaker:'NARRATOR', text:"20% — but only 20% of the DWELLING amount, never the full policy and never the contents figure.", enter(S){
        S.formula('DP-1 RENTAL VALUE',[
          {text:'$60,000 dwelling <span class="op">×</span> 20%',cls:''},
          {text:'= $12,000 available for rent',cls:'result'},
        ]);
        S.stamp('secondary','check','20% OF DWELLING ONLY');
    }},
    { speaker:'NARRATOR', text:"And here's the catch: using that money reduces the Coverage A dollars left over for repairing the actual damage. It's carved out of the same pool, not extra on top.", enter(S){
        S.flash('SAME LIMIT, NOT EXTRA MONEY','var(--danger)');
    }},
  ]},

{ id:'periodterritory', title:'WHEN AND<br>WHERE', hook:"Policy period vs. policy territory.", icon:'🗺️', mood:'mood-bureau', tag:'ws76 · Policy Period & Territory',
  endRule:"Policy period is WHEN coverage applies (the time frame). Policy territory is WHERE coverage applies (generally the U.S., its territories, Puerto Rico, and Canada).",
  beats:[
    { speaker:'NARRATOR', text:"An agent is walking a new policyholder through two fundamental policy concepts.", enter(S){
        S.mood('mood-bureau'); S.icon('main','🗺️',{label:'Two Basic Concepts'});
    }},
    { speaker:'CLIENT', text:"\"How do I know WHEN my coverage applies, and WHERE?\"", enter(S){
        S.icon('secondary','❓',{label:'When and Where?'});
    }},
    { speaker:'NARRATOR', text:"WHEN is the policy period — the time frame your coverage is active.", enter(S){
        S.icon('secondary','📅',{label:'Policy Period = Time Frame'});
    }},
    { speaker:'NARRATOR', text:"WHERE is the policy territory — generally the U.S., its territories, Puerto Rico, and Canada.", enter(S){
        S.stamp('secondary','check','PERIOD + TERRITORY');
        S.flash('TIME = PERIOD, PLACE = TERRITORY','var(--safe)');
    }},
    { speaker:'NARRATOR', text:"Exclusions, claim conditions, and proof-of-loss reporting are all real policy concepts too — just not the ones answering this particular question.", enter(S){}},
  ]},

{ id:'definitioninsurance', title:'THE PLAINEST<br>DEFINITION', hook:"Insurance as pure risk transfer.", icon:'📖', mood:'mood-warmnight', tag:'ws77 · Definition of Insurance',
  endRule:"Insurance is the transfer of financial risk for damage to property or health from the individual to the insurance company, with no losses borne by the individual — the plain, textbook definition.",
  beats:[
    { speaker:'NARRATOR', text:"A student is stuck between four similar-sounding terms on a definitions quiz.", enter(S){
        S.mood('mood-warmnight'); S.icon('main','📖',{label:'Four Similar Terms'});
    }},
    { speaker:'NARRATOR', text:"\"Insurability\" is about whether a risk even QUALIFIES to be insured — a gatekeeping concept, not a transfer mechanism.", enter(S){
        S.icon('secondary','🚪',{label:'Insurability — Qualifying'});
    }},
    { speaker:'NARRATOR', text:"\"Principle of indemnity\" is about restoring someone to their pre-loss position — a payment concept, not a transfer concept.", enter(S){
        S.icon('secondary','⚖️',{label:'Indemnity — Restoring Position'});
    }},
    { speaker:'STUDENT', text:"\"So what actually describes the risk being MOVED from me to the company entirely?\"", enter(S){}},
    { speaker:'NARRATOR', text:"That's just the plain definition of insurance itself — transferring financial risk to the company, with no losses left on the individual.", enter(S){
        S.stamp('secondary','check','INSURANCE — THE PLAIN DEFINITION');
        S.flash('THE SIMPLEST ANSWER WINS','var(--safe)');
    }},
  ]},

{ id:'splitlimitwendy', title:'THREE NUMBERS,<br>THREE CATEGORIES', hook:"Wendy\'s split limit policy.", icon:'🔢', mood:'mood-industrial', tag:'ws78 · Auto Split Limits',
  endRule:"A split limit policy states separate dollar figures for per-person bodily injury, per-accident bodily injury, and property damage — three numbers for three categories, unlike a combined single limit's one number.",
  beats:[
    { speaker:'NARRATOR', text:"Wendy pulls out her auto policy declarations page to check her coverage.", enter(S){
        S.mood('mood-industrial'); S.icon('main','📄',{label:'Wendy\'s Auto Declarations'});
    }},
    { speaker:'NARRATOR', text:"$25,000 for injury to any one person. $50,000 for all people injured. $10,000 for property damage.", enter(S){
        S.formula('WENDY\'S POLICY LIMITS',[
          {text:'$25,000 <span class="op">/</span> $50,000 <span class="op">/</span> $10,000',cls:''},
          {text:'Three separate numbers',cls:'result'},
        ]);
    }},
    { speaker:'WENDY', text:"\"Is this one big number covering everything, or something else?\"", enter(S){
        S.icon('secondary','🤔',{label:'One Number or Three?'});
    }},
    { speaker:'NARRATOR', text:"Three separate numbers for three separate categories — that's the signature of a split limit policy.", enter(S){
        S.stamp('secondary','check','SPLIT LIMIT');
        S.flash('THREE NUMBERS = SPLIT LIMIT','var(--safe)');
    }},
    { speaker:'NARRATOR', text:"A combined single limit would collapse all of that into ONE figure covering the whole accident, regardless of category — that's not what Wendy has.", enter(S){}},
  ]},

{ id:'coinsurancewalt', title:'THE 75% THAT<br>WALT ACTUALLY OWNS', hook:"HO-3 co-insurance math.", icon:'🔥', mood:'mood-stormred', tag:'ws79 · HO-3 Co-insurance',
  endRule:"Co-insurance requires carrying 80% of replacement cost for full payment. Walt's $60,000 against an $80,000 requirement gives him 75% coverage, so he collects 75% of the $30,000 loss — $22,500.",
  beats:[
    { speaker:'NARRATOR', text:"Walt's home would cost $100,000 to fully rebuild. His HO-3 only carries $60,000 in coverage.", enter(S){
        S.mood('mood-stormred'); S.icon('main','🏠',{label:'Walt — $60K on $100K Home'});
    }},
    { speaker:'NARRATOR', text:"Fire breaks out. $30,000 in damage.", enter(S){
        S.shake(); S.icon('secondary','🔥',{label:'Fire — $30,000 Damage', anim:'shatter'});
        S.banner('🔥 FIRE LOSS!','$30,000 IN DAMAGE');
    }},
    { speaker:'WALT', text:"\"My policy should just pay the full $30,000, right?\"", enter(S){
        S.icon('secondary','💰',{label:'Expecting Full Payout', anim:'punch'});
    }},
    { speaker:'NARRATOR', text:"Not quite. Co-insurance requires carrying 80% of replacement cost — that's $80,000. Walt only carries $60,000.", enter(S){
        S.formula('CO-INSURANCE REQUIREMENT',[
          {text:'$100,000 <span class="op">×</span> 80%',cls:''},
          {text:'= $80,000 required',cls:'result'},
        ]);
    }},
    { speaker:'NARRATOR', text:"$60,000 ÷ $80,000 = 75%. That's Walt's co-insurance percentage — and it applies to the loss, not the policy limit.", enter(S){
        S.formula('WALT\'S ACTUAL PAYOUT',[
          {text:'75% <span class="op">×</span> $30,000 loss',cls:''},
          {text:'= $22,500',cls:'result'},
        ]);
        S.stamp('secondary','check','$22,500');
        S.flash('UNDERINSURED = PARTIAL PENALTY','var(--danger)');
    }},
  ]},

{ id:'baileedoctrine', title:'THE SHIRTS, THE<br>CLEANER, AND THE CHECK', hook:"Doctrine of No Benefit to a Bailee.", icon:'👔', mood:'mood-warning', tag:'ws80 · No Benefit to a Bailee',
  endRule:"A bailee is anyone with temporary custody of someone else's property. The Doctrine of No Benefit to a Bailee ensures the insured's own policy pays the insured — not a third party merely holding the property.",
  beats:[
    { speaker:'NARRATOR', text:"Larry drops his shirts off at the dry cleaner. That night, a fire breaks out at the shop.", enter(S){
        S.mood('mood-warning'); S.icon('main','👔',{label:'Larry\'s Shirts at the Cleaner'});
    }},
    { speaker:'NARRATOR', text:"Larry files a claim with his own insurer. The dry cleaner has an idea.", enter(S){
        S.shake(); S.icon('secondary','🔥',{label:'Fire at the Dry Cleaner', anim:'shatter'});
    }},
    { speaker:'DRY CLEANER', text:"\"Larry still owes us for the cleaning bill — make the claim check out to both of us.\"", enter(S){
        S.icon('secondary','🧾',{label:'Requesting Joint Payee', anim:'punch'});
    }},
    { speaker:'NARRATOR', text:"The insurer denies it. A bailee — someone with temporary custody of someone else's property, exactly what a dry cleaner is — doesn't get named on the check.", enter(S){
        S.icon('secondary','🚫',{label:'Doctrine of No Benefit to a Bailee'});
        S.stamp('secondary','x','REQUEST DENIED');
    }},
    { speaker:'NARRATOR', text:"Larry's policy pays LARRY, the insured — not a third party who merely had custody of the property, even one who's separately owed money.", enter(S){
        S.flash('THE POLICY PAYS THE INSURED','var(--safe)');
    }},
  ]},

{ id:'hopersonalliab', title:'THE DOG THAT<br>BIT THE WRONG POLICY', hook:"HO Personal Liability covers what the insured DOES, not what happens to them.", icon:'⚖️', mood:'mood-warmnight', tag:'ws81 · HO Personal Liability Section',
  endRule:"Personal Liability covers the insured's own negligence — bodily injury or property damage caused BY the insured's activities, on or off premises. It never covers injury to the insured or their own property, and war is always excluded.",
  beats:[
    { speaker:'NARRATOR', text:"A homeowner gets bitten by a neighbor's dog while walking down her own driveway.", enter(S){
        S.mood('mood-warmnight'); S.icon('main','🐕',{label:'Neighbor\'s Dog Bites Insured'});
    }},
    { speaker:'HOMEOWNER', text:"\"My Personal Liability section covers this, right? I got hurt.\"", enter(S){
        S.icon('secondary','🩹',{label:'Injury to the Insured', anim:'punch'});
    }},
    { speaker:'NARRATOR', text:"No — Personal Liability only covers harm the INSURED causes to someone else, never harm that happens TO the insured.", enter(S){
        S.stamp('secondary','x','WRONG DIRECTION');
    }},
    { speaker:'NARRATOR', text:"What it actually covers: bodily injury or property damage caused by the insured's own personal activities — both on and off the premises.", enter(S){
        S.icon('secondary','⚖️',{label:'Insured\'s Own Negligence', anim:'glowgold'});
        S.stamp('secondary','check','CAUSED BY THE INSURED');
    }},
    { speaker:'NARRATOR', text:"And no matter the scenario — war is always excluded, full stop, across every line of insurance.", enter(S){
        S.flash('WAR: ALWAYS EXCLUDED','var(--danger)');
    }},
  ]},

{ id:'oceanimplied', title:'THE FLAG THAT<br>WASN\'T A WARRANTY', hook:"Ocean marine\'s three real implied warranties — and the fake fourth one.", icon:'⚓', mood:'mood-industrial', tag:'ws82 · Ocean Marine Implied Warranties',
  endRule:"Ocean marine's implied warranties are that the ship is seaworthy, the voyage is legal, and the course won't deviate. There's no implied warranty about a vessel's flag or country of origin.",
  beats:[
    { speaker:'NARRATOR', text:"A cargo shipper is reading through what ocean marine coverage implicitly promises, without it even being written down.", enter(S){
        S.mood('mood-industrial'); S.icon('main','🚢',{label:'Ocean Marine — Implied Warranties'});
    }},
    { speaker:'NARRATOR', text:"The ship is seaworthy. The voyage is legal. The course won't deviate. Three warranties, always implied, never needing to be spelled out.", enter(S){
        S.icon('secondary','✅',{label:'Seaworthy / Legal / No Deviation'});
        S.stamp('secondary','check','THE REAL THREE');
    }},
    { speaker:'SHIPPER', text:"\"And the ship has to fly the flag of the country the goods came from — that's implied too, right?\"", enter(S){
        S.icon('secondary','🚩',{label:'Flag of Origin?', anim:'punch'});
    }},
    { speaker:'NARRATOR', text:"No — that's not one of the real implied warranties at all. It doesn't describe the ship or voyage being sound, so it doesn't belong on this list.", enter(S){
        S.stamp('secondary','x','NOT A REAL WARRANTY');
        S.flash('NO FLAG REQUIREMENT','var(--danger)');
    }},
  ]},

{ id:'abandonment', title:'THE PROPERTY<br>YOU CAN\'T WALK AWAY FROM', hook:"Abandonment after a loss is prohibited, not required.", icon:'🚫', mood:'mood-stormred', tag:'ws83 · Duties After a Property Loss',
  endRule:"After a property loss, the insured must report promptly, protect the property from further damage, and cooperate with the insurer. Abandoning the property is strictly prohibited, not a duty at all.",
  beats:[
    { speaker:'NARRATOR', text:"A fire damages part of a home. The insured is listing out what she thinks she has to do next.", enter(S){
        S.mood('mood-stormred'); S.icon('main','🔥',{label:'Property Loss — Fire Damage'});
    }},
    { speaker:'NARRATOR', text:"Report the loss promptly. Protect what's left from further damage. Cooperate with the insurer's investigation.", enter(S){
        S.icon('secondary','📋',{label:'Three Real Duties'});
        S.stamp('secondary','check','REQUIRED DUTIES');
    }},
    { speaker:'INSURED', text:"\"And honestly, at this point, can't I just walk away and let the insurer deal with it?\"", enter(S){
        S.icon('secondary','🚪',{label:'Just Abandon It?', anim:'shatter'});
    }},
    { speaker:'NARRATOR', text:"No — abandonment is strictly prohibited by policy provisions. She can't just walk away and expect the insurer to take the property as-is.", enter(S){
        S.stamp('secondary','x','PROHIBITED, NOT REQUIRED');
        S.flash('YOU CANNOT ABANDON THE PROPERTY','var(--danger)');
    }},
  ]},

{ id:'dpunderconstruct100', title:'THE HOUSE THAT<br>ISN\'T BUILT YET', hook:"Dwelling Under Construction: insure the FULL future value now.", icon:'🏗️', mood:'mood-warning', tag:'ws84 · DP Under Construction — 100% Value',
  endRule:"The Dwelling Under Construction endorsement requires insuring the structure at 100% of its completed value from inception — not 80%, and not reported later. The insurer gives a premium discount until the build finishes.",
  beats:[
    { speaker:'NARRATOR', text:"Gary breaks ground on a new house. He's got a Dwelling Under Construction endorsement on the DP policy.", enter(S){
        S.mood('mood-warning'); S.icon('main','🏗️',{label:'Gary — Dwelling Under Construction'});
    }},
    { speaker:'GARY', text:"\"I'll just insure it for 80% of what it'll be worth when it's done — that's the usual rule, right?\"", enter(S){
        S.icon('secondary','📉',{label:'80% Coverage?', anim:'punch'});
    }},
    { speaker:'NARRATOR', text:"Not here. This endorsement requires insuring the structure at 100% of its COMPLETED value — from the very first day of construction.", enter(S){
        S.stamp('secondary','x','NOT 80% — 100%');
    }},
    { speaker:'NARRATOR', text:"In exchange for covering the full future value up front, the insurer gives Gary a premium discount for the time before the home is actually finished.", enter(S){
        S.icon('secondary','💰',{label:'Discount Until Completion', anim:'glowgold'});
        S.flash('100% FROM DAY ONE','var(--safe)');
    }},
  ]},

{ id:'mortgageerights', title:'THE BANK THAT<br>WANTED ITS NAME ON IT', hook:"Mortgagee rights protect the lender\'s interest in the property.", icon:'🏦', mood:'mood-bureau', tag:'ws85 · Mortgagee Rights',
  endRule:"When a bank holds the mortgage and demands to be listed as an insurable interest, that's mortgagee rights — a named provision protecting the lender's financial stake in the property.",
  beats:[
    { speaker:'NARRATOR', text:"A homeowner finances her house through a bank. The bank has a condition before it'll approve the loan.", enter(S){
        S.mood('mood-bureau'); S.icon('main','🏦',{label:'Bank Holds the Mortgage'});
    }},
    { speaker:'BANK', text:"\"We want to be listed as an insurable interest on the property policy. Non-negotiable.\"", enter(S){
        S.icon('secondary','📜',{label:'Demanding Insurable Interest'});
    }},
    { speaker:'NARRATOR', text:"This is a named, specific provision — mortgagee rights. It protects the bank's financial interest in the property it's lending against.", enter(S){
        S.stamp('secondary','check','MORTGAGEE RIGHTS');
        S.flash('THE LENDER\'S PROTECTION','var(--safe)');
    }},
    { speaker:'NARRATOR', text:"Remember the roles: the MORTGAGEE is the lender — the bank. The MORTGAGOR is the borrower. \"Additional insured interest\" and \"lender lien interest\" aren't real terms here.", enter(S){
        S.icon('secondary','🔑',{label:'Mortgagee = Lender'});
    }},
  ]},

{ id:'scheduledpersonalprop', title:'MORE THAN JUST<br>JEWELRY', hook:"The Personal Articles Floater\'s real scope: broad all-risk coverage.", icon:'💎', mood:'mood-warmnight', tag:'ws86 · Scheduled Personal Property',
  endRule:"The Scheduled Personal Property endorsement / Personal Articles Floater is best described by its BROAD all-risk coverage for scheduled items — not just jewelry, and it absolutely can cover fine arts and antiques.",
  beats:[
    { speaker:'NARRATOR', text:"A client wants to schedule some valuable items separately from her regular homeowners policy.", enter(S){
        S.mood('mood-warmnight'); S.icon('main','💎',{label:'Personal Articles Floater'});
    }},
    { speaker:'CLIENT', text:"\"This only covers jewelry, silverware, and furs, right? And I know it won't touch my grandmother's paintings — too irreplaceable.\"", enter(S){
        S.icon('secondary','🖼️',{label:'Fine Arts Excluded?', anim:'punch'});
    }},
    { speaker:'NARRATOR', text:"Both wrong. This endorsement's real strength is BROAD, open-peril \"all risk\" coverage for whatever gets scheduled — far more than just the classic three categories.", enter(S){
        S.stamp('secondary','check','BROAD ALL-RISK COVERAGE');
    }},
    { speaker:'NARRATOR', text:"And fine arts and antiques? Covering irreplaceable items like that is actually one of the MOST common reasons people use this floater in the first place.", enter(S){
        S.icon('secondary','🎨',{label:'Fine Arts — Actually Covered', anim:'glowgold'});
        S.flash('NOT EXCLUDED — A COMMON USE','var(--safe)');
    }},
  ]},

{ id:'hoeligibility', title:'THE FIFTH UNIT<br>THAT BROKE THE DEAL', hook:"Homeowners eligibility caps out at four-family dwellings.", icon:'🏘️', mood:'mood-stormred', tag:'ws87 · HO Eligibility Limits',
  endRule:"Homeowners policies are only eligible for dwellings up to four-family units. A five-unit structure — regardless of who occupies it — simply doesn't qualify for an HO policy.",
  beats:[
    { speaker:'NARRATOR', text:"An underwriter is reviewing four different applications for Homeowners coverage, one after another.", enter(S){
        S.mood('mood-stormred'); S.icon('main','🏘️',{label:'Four Applications'});
    }},
    { speaker:'NARRATOR', text:"A standard owner-occupant. An intended owner-occupant of a home still under construction. One co-owner occupying a two-family dwelling. All three: eligible.", enter(S){
        S.icon('secondary','✅',{label:'Three Eligible Scenarios'});
        S.stamp('secondary','check','ELIGIBLE');
    }},
    { speaker:'NARRATOR', text:"Then the fourth application: an owner-occupant of a five-unit structure.", enter(S){
        S.icon('secondary','🏢',{label:'Five-Unit Structure', anim:'shatter'});
    }},
    { speaker:'NARRATOR', text:"Denied — automatically. Homeowners policies cap out at four-family dwellings. Five units breaks the ceiling, no matter who lives there or how normal the rest of the situation looks.", enter(S){
        S.stamp('secondary','x','OVER THE 4-UNIT CAP');
        S.flash('FOUR UNITS IS THE HARD LIMIT','var(--danger)');
    }},
  ]},

{ id:'warehousetowarehouse', title:'THE NICKNAME<br>THAT GIVES IT AWAY', hook:"Ocean marine covers cargo warehouse-to-warehouse.", icon:'📦', mood:'mood-industrial', tag:'ws88 · Ocean Marine — Warehouse-to-Warehouse',
  endRule:"Ocean marine is the broadest marine coverage available, protecting cargo on the water, over the water, or on land in transit — which is exactly why it's nicknamed \"warehouse-to-warehouse\" coverage.",
  beats:[
    { speaker:'NARRATOR', text:"A shipment of goods needs coverage for its full journey — off a warehouse shelf, onto a truck, across the ocean, into another warehouse.", enter(S){
        S.mood('mood-industrial'); S.icon('main','📦',{label:'Full Journey — Warehouse to Warehouse'});
    }},
    { speaker:'SHIPPER', text:"\"Motor truck cargo should cover the whole trip, right? It's cargo, it's on a truck part of the way.\"", enter(S){
        S.icon('secondary','🚚',{label:'Motor Truck Cargo?', anim:'punch'});
    }},
    { speaker:'NARRATOR', text:"That only covers the trucking leg — not the ocean crossing, not the full door-to-door journey.", enter(S){
        S.stamp('secondary','x','TRUCKING LEG ONLY');
    }},
    { speaker:'NARRATOR', text:"Ocean marine is the broadest marine coverage there is — on the water, over the water, or on land. That's exactly why it earned the nickname \"warehouse-to-warehouse.\"", enter(S){
        S.icon('secondary','⚓',{label:'Ocean Marine — Warehouse-to-Warehouse', anim:'glowgold'});
        S.stamp('secondary','check','FULL DOOR-TO-DOOR COVERAGE');
        S.flash('THE NICKNAME IS THE ANSWER','var(--safe)');
    }},
  ]},

{ id:'bopdirectdamage', title:'THE MEAT VS.<br>THE MONEY', hook:"Same blackout, two different BOP endorsements.", icon:'🥩', mood:'mood-stormred', tag:'ws89 · BOP Utility Services Direct Damage',
  endRule:"Direct Damage endorsement covers physical property/contents lost in a utility outage. Time Element endorsement covers the resulting income loss. Same outage, different endorsement depending on what's actually being asked.",
  beats:[
    { speaker:'NARRATOR', text:"Same blackout at Strasburg Meats — six blocks away, a crash knocks out the substation, power's down for 3 days.", enter(S){
        S.mood('mood-stormred'); S.icon('main','🏪',{label:'Strasburg Meats — Power Out Again'});
    }},
    { speaker:'NARRATOR', text:"The health department orders every last bit of spoiled meat thrown out.", enter(S){
        S.shake(); S.icon('secondary','🥩',{label:'Contents Destroyed', anim:'shatter'});
        S.banner('🗑️ CONTENTS LOST!','ALL PRODUCT DISCARDED');
    }},
    { speaker:'OWNER', text:"\"Last time we talked about the income I lost. This time — what covers the actual MEAT that spoiled?\"", enter(S){
        S.icon('secondary','❓',{label:'Physical Contents, Not Income'});
    }},
    { speaker:'NARRATOR', text:"Different question, different endorsement. The power interruption directly caused physical loss to the contents — base contents coverage excludes that.", enter(S){
        S.stamp('secondary','x','CONTENTS COVERAGE EXCLUDES IT');

    { speaker:'NARRATOR', text:"The fix is the Utility Services Direct Damage endorsement — a separate endorsement from the Time Element version, which instead handles the INCOME side, not the physical property.", enter(S){
        S.icon('secondary','🔧',{label:'Direct Damage Endorsement', anim:'glowgold'});
        S.flash('DIRECT DAMAGE = PROPERTY, TIME ELEMENT = INCOME','var(--safe)');
    }},
  ]},

{ id:'splitlimittom', title:'THE $5,000<br>RAY DIDN\'T GET', hook:"Split limits cap EACH person, not the total damages.", icon:'🚗', mood:'mood-industrial', tag:'ws90 · PAP Split Limit Math',
  endRule:"With split limits, check each injured person individually against the per-person cap first, then add the capped amounts together. Defense costs are always paid on top, never subtracted from the limit.",
  beats:[
    { speaker:'NARRATOR', text:"Tom carries a Personal Auto Policy with 100/300/50 limits. He causes a collision, injuring two people — Bob and Ray.", enter(S){
        S.mood('mood-industrial'); S.icon('main','🚗',{label:'Tom — 100/300/50 PAP'});
    }},
    { speaker:'NARRATOR', text:"Bob suffers $45,000 in damages. Ray suffers $105,000.", enter(S){
        S.icon('secondary','💥',{label:'Bob: $45K — Ray: $105K', anim:'punch'});
    }},
    { speaker:'TOM', text:"\"So my policy pays the full $150,000 total, right? That's what they actually suffered.\"", enter(S){
        S.icon('secondary','🧮',{label:'$150,000 Total?'});
    }},
    { speaker:'NARRATOR', text:"No — check EACH person against the $100,000 per-person cap individually. Bob's $45,000 stays as-is. Ray's $105,000 gets capped down to $100,000.", enter(S){
        S.stamp('secondary','x','NOT A SIMPLE TOTAL');
        S.formula('TOM\'S ACTUAL PAYOUT',[
          {text:'Bob: $45,000 <span class="op">+</span> Ray: $100,000 (capped)',cls:''},
          {text:'= $145,000',cls:'result'},
        ]);
    }},
    { speaker:'NARRATOR', text:"And defense costs get added on top of that $145,000 — they're never carved out of the liability limit itself.", enter(S){
        S.icon('secondary','⚖️',{label:'Defense Costs — Always Extra', anim:'glowgold'});
        S.flash('$145,000 PLUS DEFENSE COSTS','var(--safe)');
    }},
  ]},

{ id:'felalongshore', title:'THE TWO LAWS<br>THAT OUTRANK THE STATE', hook:"FELA and Longshore/Harbor both provide greater federal benefits.", icon:'⚓', mood:'mood-medical', tag:'ws91 · Workers\' Comp Federal Overlap',
  endRule:"FELA covers interstate railroad workers, and the Longshore and Harbor Workers' Compensation Act covers those who load, unload, build, and repair ships. Both are separate federal laws providing greater benefits than state Workers' Comp.",
  beats:[
    { speaker:'NARRATOR', text:"Two very different workers get hurt on the job in the same week — a railroad engineer, and a dockworker loading a cargo ship.", enter(S){
        S.mood('mood-medical'); S.icon('main','⚓',{label:'Two Workers, Two Federal Laws'});
    }},
    { speaker:'STUDENT', text:"\"There's ONE federal law that beats state Workers' Comp for special cases, right? Which one is it?\"", enter(S){
        S.icon('secondary','❓',{label:'Just One Law?', anim:'punch'});
    }},
    { speaker:'NARRATOR', text:"Notice the question's own wording — \"certain categories of employees,\" plural. That's the tell: there isn't just one law here, there are two.", enter(S){
        S.icon('secondary','🔍',{label:'Plural = Two Laws'});
    }},
    { speaker:'NARRATOR', text:"FELA covers interstate railroad workers. The Longshore and Harbor Workers' Compensation Act covers those who load, unload, build, and repair ships in port or at sea.", enter(S){
        S.stamp('secondary','check','BOTH LAWS APPLY');
    }},
    { speaker:'NARRATOR', text:"Each one provides greater benefits than state Workers' Comp for its own category of worker — the correct answer is both, not either one alone.", enter(S){
        S.flash('BOTH FELA AND LONGSHORE/HARBOR','var(--safe)');
    }},
  ]},

{ id:'mysteriousdisappearance', title:'THE WATCH THAT<br>JUST WASN\'T THERE', hook:"No force, no break-in, no known cause — that\'s its own category.", icon:'⌚', mood:'mood-warmnight', tag:'ws92 · Mysterious Disappearance',
  endRule:"Robbery needs a threat of force; burglary needs visible signs of forced entry. When property is simply gone with no known cause, that's a mysterious disappearance — a distinct category from either.",
  beats:[
    { speaker:'NARRATOR', text:"The Chens host a party for close friends. Guests pile their coats onto the bed in the back bedroom.", enter(S){
        S.mood('mood-warmnight'); S.icon('main','🎉',{label:'The Chens\' Party'});
    }},
    { speaker:'NARRATOR', text:"Two days later, Mr. Chen notices his wristwatch is gone from the dresser.", enter(S){
        S.icon('secondary','⌚',{label:'Watch Missing — 2 Days Later', anim:'punch'});
        S.banner('❓ MISSING!','NO IDEA WHAT HAPPENED');
    }},
    { speaker:'MR. CHEN', text:"\"Someone at the party must have robbed me, or broken in to steal it.\"", enter(S){
        S.icon('secondary','🔍',{label:'Robbery or Burglary?'});
    }},
    { speaker:'NARRATOR', text:"Neither fits. Robbery needs a threat of force. Burglary needs visible signs of forced entry. There's no evidence of either one here.", enter(S){
        S.stamp('secondary','x','NEITHER FITS THE EVIDENCE');
    }},
    { speaker:'NARRATOR', text:"Property missing, cause completely unknown, two full days of unaccounted-for time — that's its own defined category: mysterious disappearance.", enter(S){
        S.icon('secondary','❓',{label:'Mysterious Disappearance', anim:'glowgold'});
        S.flash('UNKNOWN CAUSE = ITS OWN CATEGORY','var(--safe)');
    }},
  ]},

{ id:'allriskexclusions', title:'THE PROMISE<br>THAT WASN\'T THE POLICY', hook:"All-risk coverage lives and dies in the exclusions section.", icon:'📖', mood:'mood-bureau', tag:'ws93 · All-Risk — Where to Check',
  endRule:"An all-risk policy covers everything unless specifically excluded. After a loss, the real answer to \"is this covered\" lives in the exclusions section, not in whatever the agent said in passing.",
  beats:[
    { speaker:'NARRATOR', text:"Phil buys an all-risk policy. His agent tells him, casually, that everything's covered.", enter(S){
        S.mood('mood-bureau'); S.icon('main','📋',{label:'Phil\'s All-Risk Policy'});
    }},
    { speaker:'PHIL', text:"\"Great, so after a loss I don't need to check anything — the agent already told me I'm covered.\"", enter(S){
        S.icon('secondary','🤝',{label:'Trusting the Agent\'s Word', anim:'punch'});
    }},
    { speaker:'NARRATOR', text:"That broad statement isn't proof of anything. All-risk means covered UNLESS excluded — the actual boundaries live in one specific place.", enter(S){
        S.stamp('secondary','x','AGENT\'S WORD ISN\'T THE POLICY');
    }},
    { speaker:'NARRATOR', text:"The exclusions section. That's where Phil actually needs to look to see if his specific cause of loss is carved out or not.", enter(S){
        S.icon('secondary','📖',{label:'Exclusions Section', anim:'glowgold'});
        S.flash('CHECK THE EXCLUSIONS, NOT THE AGENT\'S MEMORY','var(--safe)');
    }},
    { speaker:'NARRATOR', text:"If the agent turns out to be wrong, that could open the door to an errors and omissions claim — but Phil would still have to prove he was misled.", enter(S){}},
  ]},

{ id:'mortgagee60days', title:'THE LENDER\'S<br>SECOND CHANCE', hook:"60 extra days if the insured drops the ball on paperwork.", icon:'🏦', mood:'mood-bureau', tag:'ws94 · Mortgagee Proof of Loss',
  endRule:"If the insured fails to submit proof of loss, the mortgagee gets an additional 60 days after the loss to submit it themselves — protecting the lender's interest even when the insured misses the paperwork.",
  beats:[
    { speaker:'NARRATOR', text:"A house fire damages a mortgaged property. The insured is supposed to file the proof of loss — but doesn't.", enter(S){
        S.mood('mood-bureau'); S.icon('main','📄',{label:'Proof of Loss — Insured Drops It'});
    }},
    { speaker:'BANK', text:"\"Wait — does our interest in this property just evaporate because HE forgot to file paperwork?\"", enter(S){
        S.icon('secondary','😰',{label:'Lender\'s Interest at Risk', anim:'punch'});
    }},
    { speaker:'NARRATOR', text:"No — the mortgagee gets a built-in safety net. An additional 60 days after the loss to submit the proof of loss themselves.", enter(S){
        S.stamp('secondary','check','60 DAYS — MORTGAGEE\'S BACKSTOP');
        S.flash('THE LENDER\'S INTEREST STAYS PROTECTED','var(--safe)');
    }},
    { speaker:'NARRATOR', text:"This pairs directly with mortgagee rights — the lender's protections don't stop at just being named on the policy. There's a real deadline safety net behind it too.", enter(S){}},
  ]},

{ id:'hocoverageCsublimits', title:'THE WATCH<br>THAT HAD A CEILING', hook:"Named sublimit categories vs. ordinary worldwide personal property.", icon:'💍', mood:'mood-warning', tag:'ws95 · HO Coverage C Sublimits',
  endRule:"Firearms, silverware/gold/pewter, and jewelry/watches/furs/stones all carry dollar sublimits and require theft specifically. Ordinary personal property, by contrast, is covered worldwide with no such cap.",
  beats:[
    { speaker:'NARRATOR', text:"An adjuster is walking through what Coverage C actually caps versus what it doesn't.", enter(S){
        S.mood('mood-warning'); S.icon('main','💍',{label:'Coverage C — Personal Property'});
    }},
    { speaker:'NARRATOR', text:"Firearms — capped. Silverware, gold ware, pewter — capped. Jewelry, watches, furs, precious stones — capped. All three, theft-only, dollar-limited.", enter(S){
        S.icon('secondary','🔒',{label:'Three Named Sublimit Categories'});
        S.stamp('secondary','check','ALL THREE HAVE SUBLIMITS');
    }},
    { speaker:'CLIENT', text:"\"And my regular stuff I packed for my trip to Myrtle Beach — that's capped too, right?\"", enter(S){
        S.icon('secondary','🏖️',{label:'Property on a Trip?', anim:'punch'});
    }},
    { speaker:'NARRATOR', text:"No — ordinary personal property is covered worldwide under Coverage C, no special sublimit category. It just travels with the policy wherever it goes.", enter(S){
        S.stamp('secondary','x','NOT ONE OF THE NAMED CATEGORIES');
        S.flash('WORLDWIDE, NO SUBLIMIT','var(--safe)');
    }},
  ]},

{ id:'boatownersscope', title:'THE HULL, THE GEAR,<br>AND THE LIABILITY', hook:"Boatowners bundles all three, like an auto policy for the water.", icon:'🚤', mood:'mood-industrial', tag:'ws96 · Boatowners Policy Scope',
  endRule:"A Boatowners policy bundles hull damage, equipment coverage, and watercraft liability all in one package — not limited to inland lakes, and not stopping short at just one or two pieces.",
  beats:[
    { speaker:'NARRATOR', text:"A boat owner is shopping for coverage, assuming a Boatowners policy is just hull damage and nothing more.", enter(S){
        S.mood('mood-industrial'); S.icon('main','🚤',{label:'Boatowners Policy'});
    }},
    { speaker:'OWNER', text:"\"So this just covers the hull if it gets damaged? And only on inland lakes?\"", enter(S){
        S.icon('secondary','🌊',{label:'Hull Only? Lakes Only?', anim:'punch'});
    }},
    { speaker:'NARRATOR', text:"Neither limitation is real. Think of it as the marine version of an auto policy — physical damage to the vessel AND liability for what it does to others, bundled together.", enter(S){
        S.stamp('secondary','x','NOT HULL-ONLY, NOT LAKES-ONLY');
    }},
    { speaker:'NARRATOR', text:"The hull. The equipment aboard it. And watercraft liability for harm caused to others. All three, one policy.", enter(S){
        S.icon('secondary','⛵',{label:'Hull + Equipment + Liability', anim:'glowgold'});
        S.flash('THE FULL PACKAGE, LIKE AN AUTO POLICY','var(--safe)');
    }},
  ]},

{ id:'dp1businessexclusion', title:'THE SHED THAT<br>BECAME A BUSINESS', hook:"Farming counts as business use, even in a DP-1 storage shed.", icon:'🌾', mood:'mood-warning', tag:'ws97 · DP-1 Business Use Exclusion',
  endRule:"Coverage B on other structures excludes business use. Farming counts as a business activity — storing farm machinery and hay crosses that line, even in a structure that otherwise looks like ordinary storage.",
  beats:[
    { speaker:'NARRATOR', text:"George insures his dwelling for $40,000 under a DP-1. Coverage B lets him apply up to 10% toward other structures on the property.", enter(S){
        S.mood('mood-warning'); S.icon('main','🏠',{label:'George — DP-1, $40K Dwelling'});
    }},
    { speaker:'NARRATOR', text:"A garage rented to a neighbor for personal car storage — fine. A boathouse for his own speedboat — fine. A hobby woodworking shed — fine.", enter(S){
        S.icon('secondary','🚗',{label:'Personal Use Structures'});
        S.stamp('secondary','check','ALL PERSONAL USE — COVERED');
    }},
    { speaker:'NARRATOR', text:"Then there's the shed storing baled hay and a neighbor's farm combine.", enter(S){
        S.icon('secondary','🌾',{label:'Farm Equipment Storage', anim:'shatter'});
    }},
    { speaker:'NARRATOR', text:"That one's excluded — farming is classified as a BUSINESS activity, even when it just looks like stuff sitting in a shed. Coverage B doesn't extend to business use.", enter(S){
        S.stamp('secondary','x','FARMING = BUSINESS USE');
        S.flash('BUSINESS USE IS ALWAYS EXCLUDED','var(--danger)');
    }},
  ]},

{ id:'ho2broadboth', title:'BROAD ON BOTH<br>SIDES OF THE LEDGER', hook:"HO-2 is the one form that\'s broad form on dwelling AND contents.", icon:'🏡', mood:'mood-warmnight', tag:'ws98 · HO-2 Broad Form Both Sides',
  endRule:"HO-2 provides broad form coverage on both the dwelling and personal property. HO-3 mixes special/broad, HO-5 is special/special (all risk on both), and HO-8 is basic/basic.",
  beats:[
    { speaker:'NARRATOR', text:"Four homeowners forms, lined up by their actual coverage levels on two things: the dwelling, and the contents inside it.", enter(S){
        S.mood('mood-warmnight'); S.icon('main','🏡',{label:'Four HO Forms, Two Categories'});
    }},
    { speaker:'NARRATOR', text:"HO-8 sits at the bottom — basic coverage on both sides. HO-5 sits at the top — special/all-risk on both sides.", enter(S){
        S.icon('secondary','📊',{label:'HO-8: Basic/Basic — HO-5: Special/Special'});
    }},
    { speaker:'STUDENT', text:"\"And HO-3 — that's broad form on both the dwelling and the contents, right? It's the most common one.\"", enter(S){
        S.icon('secondary','🤔',{label:'HO-3 = Broad/Broad?', anim:'punch'});
    }},
    { speaker:'NARRATOR', text:"Close, but no — HO-3 actually MIXES levels: special/open-peril on the dwelling, broad form on contents. Not broad on both.", enter(S){
        S.stamp('secondary','x','HO-3 IS A MIX, NOT BROAD/BROAD');
    }},
    { speaker:'NARRATOR', text:"The one that's genuinely broad form on BOTH the dwelling and personal property is HO-2 — one level down from HO-3's special-dwelling upgrade.", enter(S){
        S.icon('secondary','✅',{label:'HO-2 — Broad/Broad', anim:'glowgold'});
        S.flash('HO-2 IS THE TRUE BROAD/BROAD FORM','var(--safe)');
    }},
  ]},

{ id:'representations', title:'THE TRUTH,<br>AS BEST HE KNEW IT', hook:"Application answers are representations, not warranties.", icon:'📝', mood:'mood-bureau', tag:'ws99 · Applications — Representations',
  endRule:"A representation is the truth to the best of the applicant's knowledge and belief — not an absolute guarantee (warranty), and not automatically a lie (misrepresentation). Application answers are held to this standard.",
  beats:[
    { speaker:'NARRATOR', text:"An applicant fills out an insurance application, answering every question as honestly as he knows how.", enter(S){
        S.mood('mood-bureau'); S.icon('main','📝',{label:'Insurance Application'});
    }},
    { speaker:'STUDENT', text:"\"These answers are basically warranties, right? He's guaranteeing they're all completely accurate.\"", enter(S){
        S.icon('secondary','⚖️',{label:'Warranty = Absolute Guarantee?', anim:'punch'});
    }},
    { speaker:'NARRATOR', text:"Not quite that strict. A warranty is an absolute guarantee — application answers don't rise to that bar.", enter(S){
        S.stamp('secondary','x','NOT A WARRANTY');
    }},
    { speaker:'NARRATOR', text:"They're representations — the truth to the best of the applicant's own knowledge and belief at the time. Not a guarantee, and not automatically a lie either.", enter(S){
        S.icon('secondary','✅',{label:'Representations', anim:'glowgold'});
        S.flash('BEST KNOWLEDGE, NOT ABSOLUTE GUARANTEE','var(--safe)');
    }},
  ]},

{ id:'foreigncoverage90', title:'THE 90-DAY<br>BRIDGE OVERSEAS', hook:"A temporary endorsement, on purpose — not a permanent fix.", icon:'✈️', mood:'mood-medical', tag:'ws100 · Foreign Coverage Endorsement',
  endRule:"The Foreign Coverage Endorsement provides temporary Workers' Comp coverage for US citizens working outside the country for no longer than 90 days — a bridge, not a long-term solution.",
  beats:[
    { speaker:'NARRATOR', text:"A US company sends an employee overseas for a short-term assignment. Workers' Comp needs to follow them.", enter(S){
        S.mood('mood-medical'); S.icon('main','✈️',{label:'US Citizen Working Abroad'});
    }},
    { speaker:'EMPLOYEE', text:"\"So this Foreign Coverage Endorsement covers me the whole time I'm out here — however long that ends up being?\"", enter(S){
        S.icon('secondary','🌍',{label:'Open-Ended Coverage?', anim:'punch'});
    }},
    { speaker:'NARRATOR', text:"No — this is explicitly a temporary bridge, not a permanent solution. It's built with a hard cutoff.", enter(S){
        S.stamp('secondary','x','NOT OPEN-ENDED');
    }},

{ id:'waiverdefinition', title:'THE RIGHT<br>SHE GAVE UP ON PURPOSE', hook:"Waiver is voluntary; estoppel is being blocked by your own conduct.", icon:'🤝', mood:'mood-bureau', tag:'ws101 · Waiver',
  endRule:"Waiver means voluntarily giving up a known right, on purpose. Estoppel is different — being prevented from later asserting a right because of your own prior conduct or statements.",
  beats:[

        S.icon('secondary','🚫',{label:'Estoppel?', anim:'punch'});

    { speaker:'NARRATOR', text:"Close cousins, but different mechanisms. Estoppel is being BLOCKED from asserting a right because of your own earlier conduct or statements — it's not really a choice.", enter(S){
        S.stamp('secondary','x','ESTOPPEL IS ABOUT BEING BLOCKED');
    }},
    { speaker:'NARRATOR', text:"This is simpler and more direct: the voluntary abandonment of a known legal right. That's the textbook definition of waiver.", enter(S){

        S.flash('VOLUNTARY = WAIVER','var(--safe)');

{ id:'coinsurancesmith', title:'THE SAME MATH,<br>A BIGGER BUILDING', hook:"Commercial co-insurance, same two-step formula as Walt\'s fire.", icon:'🏢', mood:'mood-stormred', tag:'ws102 · Commercial Co-insurance Math',
  endRule:"Same co-insurance formula every time: find the required coverage (replacement cost × 80%), divide what's actually carried by that requirement, then apply that percentage to the LOSS — not the policy limit. Deductible comes off last.",
  beats:[
    { speaker:'NARRATOR', text:"Mr. Smith carries $400,000 of commercial property coverage on a building that would cost $600,000 to replace.", enter(S){
        S.mood('mood-stormred'); S.icon('main','🏢',{label:'Mr. Smith — $400K on a $600K Building'});
    }},
    { speaker:'NARRATOR', text:"A fire causes $120,000 in damage. His policy carries an 80% co-insurance clause.", enter(S){
        S.shake(); S.icon('secondary','🔥',{label:'$120,000 Fire Loss', anim:'shatter'});
        S.banner('🔥 FIRE LOSS!','80% CO-INSURANCE CLAUSE');
    }},
    { speaker:'NARRATOR', text:"Step one: the required coverage. $600,000 × 80% = $480,000 needed to avoid a penalty.", enter(S){
        S.formula('CO-INSURANCE REQUIREMENT',[
          {text:'$600,000 <span class="op">×</span> 80%',cls:''},
          {text:'= $480,000 required',cls:'result'},
        ]);
    }},
    { speaker:'NARRATOR', text:"Step two: what he actually carries ($400,000) divided by what's required ($480,000) — his co-insurance percentage.", enter(S){
        S.formula('MR. SMITH\'S ACTUAL PAYOUT',[
          {text:'($400,000 <span class="op">÷</span> $480,000) <span class="op">×</span> $120,000',cls:''},
          {text:'= $100,000',cls:'result'},
        ]);
        S.stamp('secondary','check','$100,000 MINUS DEDUCTIBLE');
    }},
    { speaker:'NARRATOR', text:"Exact same formula as Walt's HO-3 fire loss — just commercial numbers this time. The deductible comes off at the very end.", enter(S){
        S.flash('SAME TWO-STEP FORMULA, EVERY TIME','var(--safe)');
    }},
  ]},

/* ============================================================
   IMPORT — reads a Study Grove "review notes" .txt export and
   builds a fresh custom chapter of auto-narrated scenes from
   whatever's currently flagged as a trouble spot. Re-importing
   fully replaces the chapter rather than appending to it.
   ============================================================ */
const IMPORT_KEY='storyModeImportedNotes_v1';
const IMPORT_MOODS=['mood-bureau','mood-industrial','mood-medical','mood-stormred','mood-warmnight','mood-warning'];
function iconForImportedCategory(cat){
  const c=cat.toLowerCase();
  if(c.includes('dwelling')||c.includes('dp-')||c.includes('dp ')) return '🏚️';
  if(c.includes('homeowner')||c.includes('ho-')||c.includes('ho ')) return '🏠';
  if(c.includes('auto')||c.includes('pap')||c.includes('vehicle')) return '🚗';
  if(c.includes('workers')||c.includes('comp')) return '🩹';
  if(c.includes('bop')||c.includes('business')||c.includes('commercial')) return '🏢';
  if(c.includes('license')||c.includes('producer')||c.includes('regulat')) return '📋';
  if(c.includes('bond')) return '📜';
  if(c.includes('crime')) return '🔐';
  if(c.includes('marine')) return '⚓';
  if(c.includes('boat')) return '🚤';
  return '📖';
}
function parseReviewNotes(text){
  const blocks=text.split(/\n\s*\n/).map(b=>b.trim()).filter(Boolean);
  const entries=[];
  blocks.forEach(block=>{
    const lines=block.split('\n');
    const headMatch=lines[0] && lines[0].match(/^\d+\.\s*\[(.+?)\]\s*—\s*missed\s*(\d+)×/);
    if(!headMatch) return;
    const cat=headMatch[1], missCount=parseInt(headMatch[2],10)||0;
    let q='', correct='', why='';
    lines.slice(1).forEach(line=>{
      if(line.startsWith('Q: ')) q=line.slice(3).trim();
      else if(line.startsWith('Correct answer: ')) correct=line.slice(16).trim();
      else if(line.startsWith('Why: ')) why=line.slice(5).trim();
    });
    if(q && correct && why) entries.push({cat,missCount,q,correct,why});
  });
  return entries;
}
function generateImportedStories(entries){
  return entries.map((e,i)=>{
    const id='imp_'+i;
    const icon=iconForImportedCategory(e.cat);
    const mood=IMPORT_MOODS[i%IMPORT_MOODS.length];
    return {
      id, icon, mood,
      title:e.cat.toUpperCase(),
      hook:e.q.length>70 ? e.q.slice(0,68)+'…' : e.q,
      tag:'Imported · missed '+e.missCount+'×',
      endRule:e.why,
      beats:[
        { speaker:'NARRATOR', text:e.q, enter(S){
            S.mood(mood); S.icon('main',icon,{label:e.cat});
        }},
        { speaker:'NARRATOR', text:"The answer: "+e.correct, enter(S){
            S.icon('secondary','✅',{label:e.correct, anim:'glowgold'});
            S.stamp('secondary','check','CORRECT ANSWER');
            S.flash(e.correct.toUpperCase(),'var(--safe)');
        }},
        { speaker:'NARRATOR', text:e.why, enter(S){} },
      ]
    };
  });
}
function refreshImportedChapter(entries, importedAt){
  // wipe any previously imported stories, then add the fresh batch
  for(let i=STORIES.length-1;i>=0;i--){ if(STORIES[i].id.startsWith('imp_')) STORIES.splice(i,1); }
  const newStories=generateImportedStories(entries);
  STORIES.push(...newStories);

  const existingIdx=CHAPTERS.findIndex(c=>c.id==='imported');
  if(existingIdx!==-1) CHAPTERS.splice(existingIdx,1);
  if(entries.length){
    CHAPTERS.unshift({
      id:'imported', num:'★', icon:'📥',
      title:'My Trouble Spots',
      blurb:'Imported from Study Grove on '+importedAt+' — '+entries.length+' scene'+(entries.length===1?'':'s')+'. Re-import anytime to refresh this chapter with your current misses.',
      storyIds:newStories.map(s=>s.id),
    });
  }
}
function handleImportFile(event){
  const file=event.target.files && event.target.files[0];
  if(!file) return;
  const reader=new FileReader();
  reader.onload=function(e){
    const entries=parseReviewNotes(e.target.result);
    if(!entries.length){
      alert('Couldn\'t find any trouble spots in that file — make sure it\'s the "study-grove-review-notes.txt" download from Study Grove\'s trouble panel.');
      return;
    }
    const importedAt=new Date().toLocaleDateString();
    try{ localStorage.setItem(IMPORT_KEY, JSON.stringify({entries, importedAt})); }catch(err){}
    refreshImportedChapter(entries, importedAt);
    renderChapters();
    sfxChapterOpen();
  };
  reader.readAsText(file);
  event.target.value='';
}
function loadImportedChapterFromStorage(){
  try{
    const raw=localStorage.getItem(IMPORT_KEY);
    if(!raw) return;
    const d=JSON.parse(raw);
    if(d && d.entries && d.entries.length) refreshImportedChapter(d.entries, d.importedAt);
  }catch(e){}
}

function ensureAudioCtx(){
  if(!audioCtx){
    try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; }
  }
  if(audioCtx.state==='suspended') audioCtx.resume();
  return audioCtx;
}
function playTone(freq, startOffset, duration, type, gainVal){
  if(sfxMuted) return;
  const ctx=ensureAudioCtx();

  try{
    const osc=ctx.createOscillator();
    const gain=ctx.createGain();
    osc.type=type||'sine';
    osc.frequency.value=freq;
    const t0=ctx.currentTime+Math.max(0,startOffset);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.linearRampToValueAtTime(gainVal||0.08, t0+0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0+duration);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(t0); osc.stop(t0+duration+0.03);
  }catch(e){}
}

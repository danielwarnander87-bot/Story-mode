<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Story Mode — Weak Spot Theater</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#161832; --night-deep:#0a0b1a;
    --gold:#e8b94a; --gold-deep:#a9791f;
    --danger:#d6453f; --safe:#5fae6f;
    --parchment:#f4ecd8; --parchment-line:#c9b481;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--night-deep);overflow:hidden;height:100%;}
  body{font-family:'Nunito',sans-serif; color:var(--parchment); display:flex; align-items:center; justify-content:center; min-height:100vh; min-height:100dvh;}
  .screen{position:relative; width:100%; max-width:780px; aspect-ratio:16/10; min-height:420px; overflow:hidden; border-radius:6px;
    box-shadow:0 0 0 3px var(--night-deep), 0 0 0 6px #4a4670, 0 20px 60px rgba(0,0,0,0.6);
    background:var(--night-deep); transform:translateZ(0);}
  @media (max-height:560px){ .screen{max-height:94vh; max-height:94dvh; width:auto;} }

  /* ============ MENU ============ */
  .menu{position:absolute; inset:0; overflow-y:auto; padding:22px 18px 26px;}
  .menu-head{position:relative; z-index:2; text-align:center; margin-bottom:16px;}
  .menu-head h1{font-family:'Press Start 2P',monospace; font-size:15px; color:var(--gold); text-shadow:2px 2px 0 #000; margin:0 0 8px; line-height:1.7;}
  .menu-head p{font-family:'VT323',monospace; font-size:17px; color:var(--parchment-line); margin:0;}
  .story-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:12px; max-width:700px; margin:0 auto;}
  .story-card{background:rgba(10,11,26,0.75); border:2px solid var(--parchment-line); border-radius:8px; padding:13px;
    cursor:pointer; transition:border-color 0.15s ease, transform 0.1s ease; position:relative;}
  .story-card:hover{border-color:var(--gold); transform:translateY(-2px);}
  .story-card:active{transform:translateY(0);}
  .story-card .sc-icon{font-size:28px; margin-bottom:6px;}
  .story-card .sc-title{font-family:'Press Start 2P',monospace; font-size:9.5px; color:var(--gold); line-height:1.5; margin-bottom:6px;}
  .story-card .sc-hook{font-size:13px; color:var(--parchment-line); line-height:1.4;}
  .story-card .sc-done{position:absolute; top:8px; right:10px; font-size:14px; color:var(--safe);}
  .story-card .sc-tag{font-family:'VT323',monospace; font-size:12px; color:#8b9bd8; margin-top:6px;}

  /* ============ CHAPTER SELECT ============ */
  .chapter-grid{position:relative; z-index:2; display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:14px; max-width:720px; margin:0 auto;}
  .chapter-card{background:rgba(10,11,26,0.78); border:2px solid var(--parchment-line); border-radius:10px; padding:16px;
    cursor:pointer; transition:border-color 0.15s ease, transform 0.1s ease; position:relative; text-align:left;}
  .chapter-card:hover{border-color:var(--gold); transform:translateY(-2px);}

  /* ============ TOWN SCENE — a little living town behind chapter select ============ */
  .town-scene{position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none;
    background:linear-gradient(160deg,#006064 0%, #00a86b 32%, #d1003c 66%, #ffe000 100%);}
  .town-star{position:absolute; width:2px; height:2px; background:#ffe000; border-radius:50%;
    animation:townTwinkle 3.2s ease-in-out infinite;}
  @keyframes townTwinkle{ 0%,100%{opacity:0.4;} 50%{opacity:1;} }
  .town-cloud{position:absolute; top:6%; width:110px; height:26px; border-radius:50px;
    background:rgba(0,229,208,0.16); filter:blur(2px);}
  .town-cloud-1{animation:townCloudDrift 46s linear infinite; top:8%;}
  .town-cloud-2{animation:townCloudDrift 64s linear infinite; top:16%; width:150px; height:32px; animation-delay:-20s;
    background:rgba(220,20,60,0.14);}
  .town-cloud-3{animation:townCloudDrift 38s linear infinite; top:4%; width:80px; height:20px; animation-delay:-9s;
    background:rgba(255,224,0,0.13);}
  .town-cloud-4{animation:townCloudDriftRev 55s linear infinite; top:22%; width:130px; height:28px; animation-delay:-30s;
    background:rgba(0,230,118,0.13);}
  .town-cloud-5{animation:townCloudDrift 71s linear infinite; top:11%; width:95px; height:22px; animation-delay:-48s;
    background:rgba(0,229,208,0.12);}
  @keyframes townCloudDrift{
    0%{transform:translateX(-160px);}
    100%{transform:translateX(calc(100vw + 160px));}
  }
  @keyframes townCloudDriftRev{
    0%{transform:translateX(calc(100vw + 160px));}
    100%{transform:translateX(-160px);}
  }
  .town-blimp{position:absolute; top:13%; width:70px; height:28px; border-radius:50%;
    background:#0a0a0a; border:2.5px solid #ffe000; animation:townBlimpDrift 75s linear infinite;}
  .town-blimp::before{content:''; position:absolute; right:-9px; top:7px; width:11px; height:14px;
    background:#0a0a0a; border:2px solid #ffe000; border-radius:2px;}
  .town-blimp::after{content:''; position:absolute; left:10px; top:9px; width:20px; height:5px;
    background:#ffe000; border-radius:2px; opacity:0.8;}
  @keyframes townBlimpDrift{
    0%{transform:translateX(-140px) translateY(0);}
    50%{transform:translateX(calc(50vw)) translateY(-10px);}
    100%{transform:translateX(calc(100vw + 140px)) translateY(0);}
  }
  .town-firefly{position:absolute; left:20%; bottom:34%; width:4px; height:4px; border-radius:50%;
    background:#ffe000; box-shadow:0 0 9px 3px rgba(255,224,0,0.95);
    animation:townFireflyPath 14s ease-in-out infinite;}
  .town-firefly-2{left:65%; bottom:40%; background:#00e5d0; box-shadow:0 0 9px 3px rgba(0,229,208,0.95);
    animation:townFireflyPath2 11s ease-in-out infinite;}
  @keyframes townFireflyPath{
    0%{transform:translate(0,0); opacity:0.3;}
    20%{opacity:1;}
    25%{transform:translate(60px,-24px);}
    50%{transform:translate(140px,10px); opacity:0.4;}
    55%{opacity:1;}
    75%{transform:translate(80px,-30px);}
    100%{transform:translate(0,0); opacity:0.3;}
  }
  @keyframes townFireflyPath2{
    0%{transform:translate(0,0); opacity:0.3;}
    30%{opacity:1; transform:translate(-70px,-18px);}
    60%{transform:translate(-130px,14px); opacity:0.4;}
    80%{opacity:1; transform:translate(-40px,-26px);}
    100%{transform:translate(0,0); opacity:0.3;}
  }
  .town-skyline{position:absolute; left:0; right:0; bottom:34px; display:flex; align-items:flex-end;
    justify-content:center; gap:8px;}
  .town-bldg{position:relative; width:var(--w); height:var(--h);
    background:#0a0a0a; border:2.5px solid #00e5d0;}
  .town-bldg:nth-of-type(3n+2){border-color:#ff3d6b;}
  .town-bldg:nth-of-type(3n){border-color:#ffe000;}
  .town-bldg-roof::before{content:''; position:absolute; top:-13px; left:50%; transform:translateX(-50%); z-index:0;
    width:0; height:0; border-left:calc(var(--w) / 2 + 6px) solid transparent;
    border-right:calc(var(--w) / 2 + 6px) solid transparent; border-bottom:15px solid #00e5d0;}
  .town-bldg-roof:nth-of-type(3n+2)::before{border-bottom-color:#ff3d6b;}
  .town-bldg-roof:nth-of-type(3n)::before{border-bottom-color:#ffe000;}
  .town-bldg-roof::after{content:''; position:absolute; top:-10px; left:50%; transform:translateX(-50%); z-index:1;
    width:0; height:0; border-left:calc(var(--w) / 2 + 3px) solid transparent;
    border-right:calc(var(--w) / 2 + 3px) solid transparent; border-bottom:12px solid #0a0a0a;}
  .town-win{position:absolute; left:var(--wx); top:var(--wy); width:6px; height:8px;
    background:#ffe000; box-shadow:0 0 6px rgba(255,224,0,0.95);
    animation:townWinFlicker 5s ease-in-out infinite;}
  .town-win:nth-of-type(4n+2){background:#00e5d0; box-shadow:0 0 6px rgba(0,229,208,0.95);}
  .town-win:nth-of-type(4n+3){background:#ff3d6b; box-shadow:0 0 6px rgba(255,61,107,0.95);}
  .town-win:nth-of-type(4n){background:#00e676; box-shadow:0 0 6px rgba(0,230,118,0.95);}
  @keyframes townWinFlicker{ 0%,40%,100%{opacity:0.95;} 45%,55%{opacity:0.25;} 60%{opacity:0.95;} }
  .town-tree{position:relative; width:24px; height:var(--th, 46px); flex-shrink:0;}
  .town-tree::before{content:''; position:absolute; bottom:0; left:50%; transform:translateX(-50%);
    width:6px; height:16px; background:#0a0a0a; border:2px solid #ffe000;}
  .town-tree::after{content:''; position:absolute; bottom:13px; left:50%; transform:translateX(-50%);
    width:28px; height:28px; border-radius:50% 50% 45% 45% / 60% 60% 40% 40%;
    background:#0a0a0a; border:2.5px solid #00e676;}
  .town-tree:nth-of-type(3n)::after{border-color:#00e5d0;}
  .town-tree:nth-of-type(3n+2)::after{border-color:#ff3d6b;}
  .town-ground{position:absolute; left:0; right:0; bottom:0; height:34px;
    background:#0a0a0a; border-top:2.5px solid #ffe000;}
  .town-walker{position:absolute; bottom:32px; font-size:15px; opacity:0.95; filter:drop-shadow(0 0 4px rgba(0,0,0,0.6));}
  .town-walker-1{animation:townWalk1 22s ease-in-out infinite;}
  .town-walker-2{animation:townWalk2 17s ease-in-out infinite; animation-delay:-6s;}
  .town-walker-3{animation:townWalk3 26s ease-in-out infinite; animation-delay:-11s;}
  .town-walker-4{animation:townWalk4 19s ease-in-out infinite; animation-delay:-3s;}
  @keyframes townWalk1{
    0%{left:-6%; transform:scaleX(1);}
    45%{left:70%; transform:scaleX(1);}
    50%{left:70%; transform:scaleX(-1);}
    95%{left:-6%; transform:scaleX(-1);}
    100%{left:-6%; transform:scaleX(1);}
  }
  @keyframes townWalk2{
    0%{left:90%; transform:scaleX(-1);}
    48%{left:15%; transform:scaleX(-1);}
    52%{left:15%; transform:scaleX(1);}
    98%{left:90%; transform:scaleX(1);}
    100%{left:90%; transform:scaleX(-1);}
  }
  @keyframes townWalk3{
    0%{left:30%; transform:scaleX(1);}
    40%{left:85%; transform:scaleX(1);}
    45%{left:85%; transform:scaleX(-1);}
    90%{left:30%; transform:scaleX(-1);}
    100%{left:30%; transform:scaleX(1);}
  }
  @keyframes townWalk4{
    0%{left:55%; transform:scaleX(-1);}
    42%{left:5%; transform:scaleX(-1);}
    47%{left:5%; transform:scaleX(1);}
    92%{left:55%; transform:scaleX(1);}
    100%{left:55%; transform:scaleX(-1);}
  }
  .chapter-card:active{transform:translateY(0);}
  .chapter-card .ch-num{font-family:'VT323',monospace; font-size:14px; color:#8b9bd8; letter-spacing:1px; margin-bottom:2px;}
  .chapter-card .ch-top{display:flex; align-items:center; gap:10px; margin-bottom:8px;}
  .chapter-card .ch-icon{font-size:26px;}
  .chapter-card .ch-title{font-family:'Press Start 2P',monospace; font-size:10.5px; color:var(--gold); line-height:1.5;}
  .chapter-card .ch-blurb{font-size:13px; color:var(--parchment-line); line-height:1.45; margin-bottom:10px;}
  .chapter-card .ch-progress{font-family:'VT323',monospace; font-size:14px; color:var(--parchment);}
  .chapter-card .ch-bar{height:6px; border-radius:3px; background:rgba(255,255,255,0.12); margin-top:5px; overflow:hidden;}
  .chapter-card .ch-bar-fill{height:100%; background:var(--gold); border-radius:3px; transition:width 0.4s ease;}

  /* ============ CHAPTER DETAIL ============ */
  .chapter-detail-head{max-width:700px; margin:0 auto 16px; text-align:center;}
  .chapter-detail-head .cd-back{font-family:'VT323',monospace; font-size:15px; color:#8b9bd8; background:none; border:none;
    cursor:pointer; padding:0 0 10px; display:inline-block;}
  .chapter-detail-head .cd-num{font-family:'VT323',monospace; font-size:14px; color:#8b9bd8; letter-spacing:1px;}
  .chapter-detail-head .cd-icon{font-size:34px; margin:4px 0 6px;}
  .chapter-detail-head h2{font-family:'Press Start 2P',monospace; font-size:14px; color:var(--gold); text-shadow:2px 2px 0 #000; margin:0 0 10px; line-height:1.6;}
  .chapter-detail-head .cd-blurb{font-family:'VT323',monospace; font-size:16px; color:var(--parchment-line); max-width:560px; margin:0 auto; line-height:1.4;}

  /* ============ CRT / RETRO OVERLAY ============ */
  .crt-overlay{position:absolute; inset:0; z-index:50; pointer-events:none; mix-blend-mode:overlay;
    background:repeating-linear-gradient(to bottom, rgba(255,255,255,0.05) 0px, rgba(255,255,255,0.05) 1px, transparent 1px, transparent 3px);
    opacity:0.5;}
  .crt-vignette{position:absolute; inset:0; z-index:49; pointer-events:none;
    background:radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.35) 100%);}
  @keyframes crtflicker{ 0%,100%{opacity:0.5;} 50%{opacity:0.42;} }
  .crt-overlay{animation:crtflicker 6s ease-in-out infinite;}

  /* ============ STAGE (shared engine) ============ */
  .stage{position:absolute; inset:0; display:none;}
  .stage.active{display:block;}
  .stage-bg{position:absolute; inset:0; transition:background 1.4s ease;}
  .stage-bg.mood-warmnight{background:linear-gradient(180deg,#1a1830 0%, #2e2a4a 45%, #26301f 100%);}
  .stage-bg.mood-stormred{background:linear-gradient(180deg,#1a1020 0%, #2e1424 45%, #150c14 100%);}
  .stage-bg.mood-industrial{background:linear-gradient(180deg,#1c1d24 0%, #34363f 45%, #202226 100%);}
  .stage-bg.mood-medical{background:linear-gradient(180deg,#0e1f2e 0%, #17384a 45%, #0c1a22 100%);}
  .stage-bg.mood-warning{background:linear-gradient(180deg,#241a0c 0%, #3d2c10 45%, #1c1608 100%);}
  .stage-bg.mood-bureau{background:linear-gradient(180deg,#10131f 0%, #1c2338 45%, #0d0f18 100%);}

  .particles{position:absolute; inset:0; pointer-events:none; z-index:1; opacity:0.5;}
  .particles span{position:absolute; width:3px; height:3px; border-radius:50%; background:var(--gold); opacity:0;
    animation:pfloat linear infinite;}
  @keyframes pfloat{0%{opacity:0; transform:translateY(0);}15%{opacity:0.6;}85%{opacity:0.4;}100%{opacity:0; transform:translateY(-90px);}}

  .icon-slot{position:absolute; z-index:5; text-align:center; opacity:0; transform:scale(0.8) translateY(6px);
    transition:opacity 0.5s ease, transform 0.5s cubic-bezier(.2,.8,.3,1);}
  .icon-slot.show{opacity:1; transform:scale(1) translateY(0);}
  #iconMain{top:16%; left:28%;}
  #iconSecondary{top:16%; left:64%;}
  .icon-emoji{font-size:56px; display:block; filter:drop-shadow(0 6px 8px rgba(0,0,0,0.4)); transition:transform 0.35s ease, filter 0.35s ease;}
  .icon-slot.punch .icon-emoji{animation:punch 0.5s ease;}
  @keyframes punch{0%{transform:scale(1);}30%{transform:scale(1.25) rotate(-4deg);}60%{transform:scale(0.92) rotate(3deg);}100%{transform:scale(1);}}
  .icon-slot.shatter .icon-emoji{animation:shatter 0.6s ease forwards;}
  @keyframes shatter{0%{transform:scale(1);filter:drop-shadow(0 6px 8px rgba(0,0,0,0.4));}40%{transform:scale(1.3);filter:drop-shadow(0 0 14px rgba(214,69,63,0.9));}100%{transform:scale(0.85);filter:drop-shadow(0 0 10px rgba(214,69,63,0.6)) grayscale(0.4);}}
  .icon-slot.glowgreen .icon-emoji{filter:drop-shadow(0 0 16px rgba(95,174,111,0.9));}
  .icon-slot.glowgold .icon-emoji{filter:drop-shadow(0 0 16px rgba(232,185,74,0.9));}
  .icon-slot.spin .icon-emoji{animation:spinSlow 2.4s linear infinite;}
  @keyframes spinSlow{100%{transform:rotate(360deg);}}
  .icon-label{margin-top:6px; display:inline-block; font-family:'VT323',monospace; font-size:14px; color:var(--gold);
    background:rgba(10,11,26,0.82); border:1.5px solid var(--gold); border-radius:5px; padding:3px 9px; white-space:nowrap;}

  .stamp{position:absolute; top:4%; z-index:8; font-family:'Press Start 2P',monospace; font-size:15px;
    padding:6px 12px; border-radius:6px; opacity:0; transform:scale(2.2) rotate(-14deg); pointer-events:none;
    transition:opacity 0.15s ease;}
  .stamp.show{opacity:1; animation:stampSlam 0.35s cubic-bezier(.2,1.6,.4,1) forwards;}
  @keyframes stampSlam{0%{transform:scale(2.4) rotate(-14deg);opacity:0;}55%{transform:scale(0.88) rotate(-14deg);opacity:1;}100%{transform:scale(1) rotate(-14deg);opacity:1;}}
  .stamp.x{color:var(--danger); border:3px solid var(--danger); background:rgba(10,11,26,0.85);}
  .stamp.check{color:var(--safe); border:3px solid var(--safe); background:rgba(10,11,26,0.85);}
  #stampMain{left:16%;} #stampSecondary{left:56%;}

  .meters{position:absolute; top:6%; left:5%; z-index:6; width:44%; opacity:0; transition:opacity 0.7s ease;}
  .meters.show{opacity:1;}
  .meter-row{margin-bottom:9px;}
  .meter-tag{font-family:'Press Start 2P',monospace; font-size:8px; color:var(--parchment); margin-bottom:3px; letter-spacing:0.5px;}
  .meter-track{position:relative; height:14px; background:rgba(10,11,26,0.7); border:1.5px solid var(--parchment-line); border-radius:3px;}
  .meter-fill{position:absolute; top:0; left:0; bottom:0; width:0%; border-radius:2px; transition:width 1.3s cubic-bezier(.2,.8,.3,1);}
  .meter-fill.c1{background:linear-gradient(90deg,#b23e3e,var(--danger));}
  .meter-fill.c2{background:linear-gradient(90deg,#3d8c53,var(--safe));}
  .meter-mark{position:absolute; top:-3px; bottom:-3px; width:2px; background:var(--gold);}
  .meter-val{font-family:'VT323',monospace; font-size:13px; color:var(--parchment); margin-top:2px;}

  .banner{position:absolute; top:36%; left:50%; transform:translate(-50%,-50%) scale(0.6); z-index:9;
    font-family:'Press Start 2P',monospace; text-align:center; opacity:0; pointer-events:none;
    transition:opacity 0.25s ease, transform 0.25s cubic-bezier(.2,1.4,.4,1);}
  .banner.show{opacity:1; transform:translate(-50%,-50%) scale(1);}
  .banner .b-main{font-size:20px; text-shadow:2px 2px 0 #000, 0 0 18px rgba(0,0,0,0.6); letter-spacing:1px;}
  .banner .b-sub{font-size:9px; color:var(--gold); margin-top:8px; text-shadow:1px 1px 0 #000;}
  @media (max-width:480px){ .banner .b-main{font-size:15px;} }

  .formula-card{position:absolute; top:6%; left:50%; transform:translateX(-50%) translateY(-8px); z-index:8; width:88%;
    max-width:440px; background:rgba(10,11,26,0.93); border:2px solid var(--gold); border-radius:8px;
    padding:11px 14px; opacity:0; transition:opacity 0.6s ease, transform 0.6s ease;
    box-shadow:0 8px 24px rgba(0,0,0,0.5); max-height:36%; overflow-y:auto;}
  .formula-card.show{opacity:1; transform:translateX(-50%) translateY(0);}
  .formula-title{font-family:'Press Start 2P',monospace; font-size:9px; text-align:center; margin-bottom:9px; letter-spacing:0.5px;}
  .formula-line{font-family:'VT323',monospace; font-size:18px; text-align:center; color:var(--parchment); line-height:1.45;
    opacity:0; transform:translateY(4px); transition:opacity 0.5s ease, transform 0.5s ease;}
  .formula-line.show{opacity:1; transform:translateY(0);}
  .formula-line .op{color:var(--gold);}
  .formula-line.result{font-size:21px; color:var(--safe); font-weight:700;}
  .formula-line.rule{font-size:15px; text-align:left; color:var(--parchment-line);}

  .flash-txt{position:absolute; z-index:10; font-family:'VT323',monospace; font-size:24px; text-shadow:2px 2px 0 #000;
    opacity:0; pointer-events:none; left:50%; top:60%; transform:translateX(-50%);}
  .flash-txt.fly{animation:flyUp 1.7s ease-out forwards;}
  @keyframes flyUp{0%{opacity:0; transform:translateX(-50%) translateY(0) scale(0.7);}15%{opacity:1; transform:translateX(-50%) translateY(-6px) scale(1.15);}80%{opacity:1;}100%{opacity:0; transform:translateX(-50%) translateY(-64px) scale(1);}}

  body.shake .screen-shake-target{animation:shakeIt 0.5s ease;}
  @keyframes shakeIt{0%,100%{transform:translate(0,0);}20%{transform:translate(-4px,2px);}40%{transform:translate(4px,-2px);}60%{transform:translate(-3px,1px);}80%{transform:translate(3px,-1px);}}

  .dialogue{position:absolute; left:4%; right:4%; bottom:4%; z-index:20;
    background:var(--night-deep); border:3px solid var(--gold); border-radius:8px;
    box-shadow:inset 0 0 0 2px #4a4670, 0 6px 18px rgba(0,0,0,0.5);
    padding:12px 16px 14px; min-height:78px; cursor:pointer;
    opacity:0; transform:translateY(10px); transition:opacity 0.5s ease, transform 0.5s ease;}
  .dialogue.show{opacity:1; transform:translateY(0);}
  .speaker{display:inline-block; font-family:'Press Start 2P',monospace; font-size:9px; color:var(--night-deep);
    background:var(--gold); padding:3px 9px; border-radius:4px; margin-bottom:7px; letter-spacing:0.5px;}
  .dtext{font-size:15.5px; line-height:1.5; color:var(--parchment); min-height:44px;}
  .advance-hint{position:absolute; bottom:8px; right:14px; font-size:12px; color:var(--gold); animation:bob 1s ease-in-out infinite; opacity:0.85;}
  @keyframes bob{0%,100%{transform:translateY(0);}50%{transform:translateY(-3px);}}

  .topbar{position:absolute; top:10px; left:12px; right:12px; z-index:25; display:flex; justify-content:space-between; pointer-events:none;}
  .topbar button{pointer-events:auto; font-family:'VT323',monospace; font-size:13px; color:var(--parchment-line);
    background:rgba(10,11,26,0.6); border:1px solid var(--parchment-line); border-radius:5px; padding:3px 9px; cursor:pointer;}
  .topbar button:disabled{opacity:0.35; cursor:default; pointer-events:none;}

  .end-card{position:absolute; inset:0; z-index:30; background:rgba(10,11,26,0.97);
    display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:0 8%;
    opacity:0; pointer-events:none; transition:opacity 0.8s ease;}
  .end-card.show{opacity:1; pointer-events:auto;}
  .end-card h2{font-family:'Press Start 2P',monospace; font-size:13px; color:var(--safe); margin:0 0 14px; line-height:1.7;}
  .end-card .rule{font-family:'VT323',monospace; font-size:19px; color:var(--parchment); max-width:460px; margin:0 0 20px; line-height:1.5;}
  .end-card .rule b{color:var(--gold);}
  .end-actions{display:flex; gap:10px; flex-wrap:wrap; justify-content:center;}
  .end-actions button{font-family:'Press Start 2P',monospace; font-size:9px; background:var(--gold); color:var(--night-deep);
    border:none; border-radius:6px; padding:10px 16px; cursor:pointer; box-shadow:0 4px 0 var(--gold-deep);}
  .end-actions button:active{transform:translateY(3px); box-shadow:0 1px 0 var(--gold-deep);}
  .end-actions button.ghost{background:transparent; color:var(--parchment); border:2px solid var(--parchment-line); box-shadow:none;}
</style>
</head>
<body>

<div class="screen">
  <div class="crt-vignette"></div>
  <div class="crt-overlay"></div>

  <!-- ============ MENU (CHAPTER SELECT) ============ -->
  <div class="menu" id="menuScreen">
    <div class="town-scene" id="townScene">
      <div class="town-star" style="left:8%; top:12%; animation-delay:0s;"></div>
      <div class="town-star" style="left:18%; top:22%; animation-delay:0.6s;"></div>
      <div class="town-star" style="left:30%; top:9%; animation-delay:1.4s;"></div>
      <div class="town-star" style="left:44%; top:16%; animation-delay:0.3s;"></div>
      <div class="town-star" style="left:58%; top:8%; animation-delay:1.9s;"></div>
      <div class="town-star" style="left:70%; top:20%; animation-delay:0.9s;"></div>
      <div class="town-star" style="left:82%; top:11%; animation-delay:1.2s;"></div>
      <div class="town-star" style="left:92%; top:24%; animation-delay:0.4s;"></div>
      <div class="town-cloud town-cloud-1"></div>
      <div class="town-cloud town-cloud-2"></div>
      <div class="town-cloud town-cloud-3"></div>
      <div class="town-cloud town-cloud-4"></div>
      <div class="town-cloud town-cloud-5"></div>
      <div class="town-blimp"></div>
      <div class="town-firefly"></div>
      <div class="town-firefly town-firefly-2"></div>
      <div class="town-skyline">
        <div class="town-tree" style="--th:38px;"></div>
        <div class="town-bldg" style="--h:70px; --w:44px;"><span class="town-win" style="--wx:10px; --wy:14px; animation-delay:0.2s;"></span><span class="town-win" style="--wx:10px; --wy:34px; animation-delay:1.8s;"></span><span class="town-win" style="--wx:26px; --wy:14px; animation-delay:0.9s;"></span><span class="town-win" style="--wx:26px; --wy:34px; animation-delay:2.4s;"></span></div>
        <div class="town-bldg" style="--h:100px; --w:52px;"><span class="town-win" style="--wx:10px; --wy:12px; animation-delay:0.5s;"></span><span class="town-win" style="--wx:10px; --wy:32px; animation-delay:2.1s;"></span><span class="town-win" style="--wx:10px; --wy:52px; animation-delay:1.1s;"></span><span class="town-win" style="--wx:30px; --wy:12px; animation-delay:1.6s;"></span><span class="town-win" style="--wx:30px; --wy:32px; animation-delay:0.3s;"></span><span class="town-win" style="--wx:30px; --wy:52px; animation-delay:2.7s;"></span></div>
        <div class="town-tree" style="--th:50px;"></div>
        <div class="town-bldg town-bldg-roof" style="--h:58px; --w:60px;"><span class="town-win" style="--wx:14px; --wy:16px; animation-delay:1.3s;"></span><span class="town-win" style="--wx:34px; --wy:16px; animation-delay:0.7s;"></span></div>
        <div class="town-bldg" style="--h:130px; --w:46px;"><span class="town-win" style="--wx:9px; --wy:14px; animation-delay:0.8s;"></span><span class="town-win" style="--wx:9px; --wy:34px; animation-delay:2.2s;"></span><span class="town-win" style="--wx:9px; --wy:54px; animation-delay:1.5s;"></span><span class="town-win" style="--wx:9px; --wy:74px; animation-delay:0.4s;"></span><span class="town-win" style="--wx:27px; --wy:14px; animation-delay:2.6s;"></span><span class="town-win" style="--wx:27px; --wy:34px; animation-delay:1s;"></span><span class="town-win" style="--wx:27px; --wy:54px; animation-delay:0.1s;"></span><span class="town-win" style="--wx:27px; --wy:74px; animation-delay:1.9s;"></span></div>
        <div class="town-tree" style="--th:34px;"></div>
        <div class="town-bldg town-bldg-roof" style="--h:66px; --w:50px;"><span class="town-win" style="--wx:12px; --wy:16px; animation-delay:0.6s;"></span><span class="town-win" style="--wx:30px; --wy:16px; animation-delay:2s;"></span></div>
        <div class="town-bldg" style="--h:88px; --w:44px;"><span class="town-win" style="--wx:9px; --wy:12px; animation-delay:1.7s;"></span><span class="town-win" style="--wx:9px; --wy:32px; animation-delay:0.2s;"></span><span class="town-win" style="--wx:9px; --wy:52px; animation-delay:2.3s;"></span><span class="town-win" style="--wx:25px; --wy:12px; animation-delay:1.1s;"></span><span class="town-win" style="--wx:25px; --wy:32px; animation-delay:0.5s;"></span><span class="town-win" style="--wx:25px; --wy:52px; animation-delay:1.4s;"></span></div>
        <div class="town-tree" style="--th:44px;"></div>
        <div class="town-bldg" style="--h:60px; --w:40px;"><span class="town-win" style="--wx:9px; --wy:14px; animation-delay:2.5s;"></span><span class="town-win" style="--wx:9px; --wy:34px; animation-delay:0.9s;"></span></div>
        <div class="town-tree" style="--th:30px;"></div>
      </div>
      <div class="town-ground"></div>
      <div class="town-walker town-walker-1">🧙</div>
      <div class="town-walker town-walker-2">🦊</div>
      <div class="town-walker town-walker-3">🐉</div>
      <div class="town-walker town-walker-4">🐈</div>
    </div>
    <button id="menuMuteBtn" onclick="toggleMute()" style="position:absolute; top:16px; right:16px; font-family:'VT323',monospace; font-size:15px; color:var(--parchment-line); background:rgba(10,11,26,0.6); border:1px solid var(--parchment-line); border-radius:5px; padding:4px 10px; cursor:pointer; z-index:5;">🔊</button>
    <button id="menuImportBtn" onclick="document.getElementById('importFileInput').click()" style="position:absolute; top:16px; left:16px; font-family:'VT323',monospace; font-size:15px; color:var(--parchment-line); background:rgba(10,11,26,0.6); border:1px solid var(--parchment-line); border-radius:5px; padding:4px 10px; cursor:pointer; z-index:5;">📥 Import</button>
    <input type="file" id="importFileInput" accept=".txt" style="display:none;" onchange="handleImportFile(event)">
    <div class="menu-head">
      <h1>STORY MODE</h1>
      <p>Watch it happen instead of reading it. Pick a chapter.</p>
    </div>
    <div class="chapter-grid" id="chapterGrid"></div>
  </div>

  <!-- ============ CHAPTER DETAIL ============ -->
  <div class="menu" id="chapterScreen" style="display:none;">
    <button id="chapterMuteBtn" onclick="toggleMute()" style="position:absolute; top:16px; right:16px; font-family:'VT323',monospace; font-size:15px; color:var(--parchment-line); background:rgba(10,11,26,0.6); border:1px solid var(--parchment-line); border-radius:5px; padding:4px 10px; cursor:pointer; z-index:5;">🔊</button>
    <div class="chapter-detail-head">
      <button class="cd-back" onclick="closeChapter()">◂ All chapters</button>
      <div class="cd-num" id="cdNum"></div>
      <div class="cd-icon" id="cdIcon"></div>
      <h2 id="cdTitle"></h2>
      <div class="cd-blurb" id="cdBlurb"></div>
    </div>
    <div class="story-grid" id="storyGrid"></div>
  </div>

  <!-- ============ STAGE ============ -->
  <div class="stage" id="stageScreen">
    <div class="screen-shake-target" style="position:absolute;inset:0;">
      <div class="stage-bg" id="stageBg"></div>
      <div class="particles" id="particles"></div>

      <div class="icon-slot" id="iconMain">
        <span class="icon-emoji" id="iconMainEmoji">❔</span>
        <div class="icon-label" id="iconMainLabel" style="display:none;"></div>
        <div class="stamp" id="stampMain"></div>
      </div>
      <div class="icon-slot" id="iconSecondary">
        <span class="icon-emoji" id="iconSecondaryEmoji">❔</span>
        <div class="icon-label" id="iconSecondaryLabel" style="display:none;"></div>
        <div class="stamp" id="stampSecondary"></div>
      </div>

      <div class="meters" id="metersBox">
        <div class="meter-row">
          <div class="meter-tag" id="meterTag1"></div>
          <div class="meter-track"><div class="meter-fill c1" id="meterFill1"></div><div class="meter-mark" id="meterMark1" style="display:none;"></div></div>
          <div class="meter-val" id="meterVal1"></div>
        </div>
        <div class="meter-row" id="meterRow2">
          <div class="meter-tag" id="meterTag2"></div>
          <div class="meter-track"><div class="meter-fill c2" id="meterFill2"></div></div>
          <div class="meter-val" id="meterVal2"></div>
        </div>
      </div>

      <div class="banner" id="banner">
        <div class="b-main" id="bannerMain"></div>
        <div class="b-sub" id="bannerSub"></div>
      </div>

      <div class="formula-card" id="formulaCard">
        <div class="formula-title" id="formulaTitle"></div>
        <div id="formulaLines"></div>
      </div>

      <div class="flash-txt" id="flashTxt"></div>
    </div>

    <div class="topbar">
      <button onclick="backToMenu()">☰ Chapter</button>
      <div style="display:flex; gap:6px; pointer-events:auto;">
        <button id="muteBtn" onclick="toggleMute()">🔊</button>
        <button id="prevStoryBtn" onclick="prevStory()">◂ Prev</button>
        <button id="nextStoryBtn" onclick="nextStory()">Next ▸</button>
        <button id="skipBtn" onclick="skipToEnd()">Skip ▸</button>
      </div>
    </div>

    <div class="dialogue" id="dialogue" onclick="advance()">
      <div class="speaker" id="speaker">NARRATOR</div>
      <div class="dtext" id="dtext"></div>
      <div class="advance-hint">▶ tap to continue</div>
    </div>

    <div class="end-card" id="endCard">
      <h2 id="endTitle">✓ SCENE COMPLETE</h2>
      <div class="rule" id="endRule"></div>
      <div class="end-actions">
        <button onclick="restartStory()">↺ Watch again</button>
        <button class="ghost" onclick="backToMenu()">☰ Back to chapter</button>
      </div>
    </div>
  </div>

</div>

<script>
/* ============================================================
   STORY DATA
   Each beat's enter(S) can call: S.mood, S.icon, S.label, S.stamp,
   S.meter, S.banner, S.formula, S.flash, S.shake
   ============================================================ */
const STORIES = [

{ id:'garage', title:'THE GARAGE THAT<br>ALMOST PAID FOR ITSELF', hook:'Coverage B, other structures, and the 10% rule.', icon:'🏚️', mood:'mood-warmnight', tag:'ws20 · Coverage B',
  endRule:"Coverage B (other structures) pays at <b>10% of Coverage A</b> automatically on an HO-3 — no extra purchase needed. But that percentage is a hard cap, not a promise to cover the full repair cost.",
  beats:[
    { speaker:'NARRATOR', text:"This home carries a Coverage A – Dwelling limit of $150,000.", enter(S){
        S.mood('mood-warmnight'); S.icon('main','🏠',{label:'Coverage A: $150,000'});
    }},
    { speaker:'NARRATOR', text:"Out back sits a detached garage. It's covered too — automatically, at no extra cost.", enter(S){
        S.icon('secondary','🏚️',{label:'Coverage B (auto-included)'});
    }},
    { speaker:'NARRATOR', text:"Coverage B always runs at 10% of Coverage A on an HO-3, unless a higher limit was purchased.", enter(S){
        S.meter({tag1:'COVERAGE B LIMIT', pct1:10, val1:'$15,000 (10% of A)'});
    }},
    { speaker:'NARRATOR', text:"Then a storm drops a tree straight through the garage roof. It'll cost $17,000 to rebuild.", enter(S){
        S.shake(); S.icon('secondary','🏚️',{label:'Damage: $17,000', anim:'shatter'});
        S.banner('🌪️ GARAGE DESTROYED!','$17,000 IN DAMAGE');
    }},
    { speaker:'COVERAGE B CLAUSE', text:"\"I only pay up to 10% of Coverage A — no matter what the repair actually costs.\"", enter(S){
        S.formula('THE 10% RULE',[
          {text:'10% <span class="op">×</span> $150,000 Coverage A',cls:''},
          {text:'= $15,000 maximum',cls:'result'},
        ]);
    }},
    { speaker:'NARRATOR', text:"$15,000 paid. The other $2,000 comes out of the homeowner's pocket — the 10% cap doesn't flex for the actual damage.", enter(S){
        S.flash('$15,000 PAID','var(--safe)');
    }},
  ]},

{ id:'umbrella', title:'THE SHIELD THAT<br>WASN\'T BIG ENOUGH', hook:'Personal umbrella vs. commercial general liability.', icon:'☂️', mood:'mood-stormred', tag:'ws21 · Umbrella vs CGL',
  endRule:"An <b>umbrella liability policy</b> sits excess over a personal liability limit once it's exhausted. A CGL is a commercial product — it has nothing to do with personal exposures, no matter how large the judgment.",
  beats:[
    { speaker:'NARRATOR', text:"Meet our insured. She carries a solid personal liability policy — $300,000 in coverage.", enter(S){
        S.mood('mood-stormred'); S.icon('main','🧍',{label:'Personal Liability: $300,000'});
    }},
    { speaker:'NARRATOR', text:"One afternoon, a guest is badly hurt on her property. The jury comes back with an award of $500,000.", enter(S){
        S.shake(); S.icon('secondary','⚖️',{label:'Judgment: $500,000', anim:'punch'});
        S.banner('⚖️ LAWSUIT!','$500,000 AWARDED');
    }},
    { speaker:'NARRATOR', text:"Her $300,000 limit pays out in full — and then it's gone. $200,000 of the judgment is still sitting there.", enter(S){
        S.icon('main','🧍',{label:'Limit Exhausted', anim:'shatter'});
        S.flash('$200,000 EXPOSED','var(--danger)');
    }},
    { speaker:'NARRATOR', text:"She reaches for a Commercial General Liability policy to plug the gap...", enter(S){
        S.icon('secondary','🏢',{label:'CGL Policy'});
        S.stamp('secondary','x','REJECTED');
    }},
    { speaker:'NARRATOR', text:"...but a CGL only protects business exposures. It has nothing to say about a personal lawsuit, no matter how large.", enter(S){
    }},
    { speaker:'NARRATOR', text:"What she actually needed was an umbrella — built specifically to sit excess over a personal liability limit.", enter(S){
        S.icon('secondary','☂️',{label:'Umbrella Policy', anim:'glowgold'});
        S.stamp('secondary','check','COVERED');
        S.flash('GAP CLOSED','var(--safe)');
    }},
  ]},

{ id:'workcomp', title:'THE FACTORY FLOOR', hook:"No-fault coverage and what actually counts as \u201cin the course of employment.\u201d", icon:'👷', mood:'mood-industrial', tag:'ws39 + ws40 · Workers\u2019 Comp',
  endRule:"Workers' Comp is <b>no-fault</b> — blame never enters into it. But it only reaches injuries that <b>arise out of and in the course of employment</b>, meaning the job itself has to be a factor, not just the clock or the building.",
  beats:[
    { speaker:'NARRATOR', text:"Two injuries. Same week. Only one of them is compensable under Workers' Comp — let's see why.", enter(S){
        S.mood('mood-industrial'); S.icon('main','🏭',{label:'Case Files'});
    }},
    { speaker:'CASE A', text:"A secretary is hurt in a car accident on her way to work — before she's even clocked in.", enter(S){
        S.icon('secondary','🚗',{label:'Commuting Accident', anim:'punch'});
    }},
    { speaker:'CASE A — RULING', text:"NOT compensable. The commute isn't 'in the course of employment' — the job hadn't started yet.", enter(S){
        S.stamp('secondary','x','DENIED');
    }},
    { speaker:'CASE B', text:"A factory worker fractures her arm on the assembly line, working overtime to finish a shift.", enter(S){
        S.icon('secondary','👷',{label:'Assembly Line Injury', anim:'punch'});
    }},
    { speaker:'CASE B — RULING', text:"COMPENSABLE. The injury happened while she was actually performing her job duties — that's the whole test.", enter(S){
        S.stamp('secondary','check','APPROVED');
        S.flash('CLAIM APPROVED','var(--safe)');
    }},
    { speaker:'NARRATOR', text:"Here's the part people forget: it doesn't matter whose fault it was. Workers' Comp pays regardless.", enter(S){
        S.banner('⚖️ NO-FAULT SYSTEM','FAULT NEVER MATTERS');
    }},
    { speaker:'NARRATOR', text:"The employee gives up the right to sue the employer, in exchange for prompt, guaranteed payment — no negligence has to be proven, ever.", enter(S){}},
  ]},

{ id:'claimsmade', title:'THE CLAIM THAT<br>CAME FIVE YEARS LATE', hook:'Claims-made vs. occurrence forms.', icon:'⏳', mood:'mood-medical', tag:'ws37 · Claims-Made Forms',
  endRule:"Professional liability — malpractice, E&amp;O — is almost always written on a <b>claims-made</b> form: coverage responds based on <b>when the claim is filed</b>, not when the incident happened, because that lag can run for years.",
  beats:[
    { speaker:'NARRATOR', text:"A doctor treats a patient in 2020. The visit goes fine. Nobody thinks about it again.", enter(S){
        S.mood('mood-medical'); S.icon('main','🩺',{label:'Treatment: 2020'});
    }},
    { speaker:'NARRATOR', text:"Five years pass.", enter(S){
        S.icon('secondary','⏳',{label:'', anim:'spin'});
        S.shake();
    }},
    { speaker:'NARRATOR', text:"In 2025, the patient finally files a malpractice claim over that same visit.", enter(S){
        S.banner('📋 CLAIM FILED','YEAR: 2025');
    }},
    { speaker:'NARRATOR', text:"An occurrence-based property policy from 2020 wouldn't reach this far forward — it's long since expired.", enter(S){
        S.icon('main','🏠',{label:'Occurrence Form (2020)'});
        S.stamp('main','x','EXPIRED');
    }},
    { speaker:'NARRATOR', text:"But the doctor's professional liability was written on a claims-made form — it responds based on when the claim shows up, not when the visit happened.", enter(S){
        S.icon('secondary','🩺',{label:'Claims-Made Form', anim:'glowgreen'});
        S.stamp('secondary','check','ACTIVE');
        S.flash('CLAIM COVERED','var(--safe)');
    }},
    { speaker:'NARRATOR', text:"That's exactly why claims-made forms exist for professional liability — the risk of a delayed lawsuit is simply too high to write it any other way.", enter(S){}},
  ]},

{ id:'rebate', title:'THE "THANK YOU"<br>THAT WASN\'T ALLOWED', hook:'What actually counts as an illegal rebate.', icon:'🎁', mood:'mood-warning', tag:'ws08 · Rebates',
  endRule:"Any inducement beyond what's written in the policy — cash, gifts, anything of value — is a <b>rebate</b>. It's illegal for the agent to offer one and illegal for the customer to accept one, even willingly.",
  beats:[
    { speaker:'NARRATOR', text:"An agent really wants to close this sale.", enter(S){
        S.mood('mood-warning'); S.icon('main','🧍',{label:'Agent'});
    }},
    { speaker:'AGENT', text:"\"Sign today, and I'll throw in a little something extra — call it a loyalty bonus.\"", enter(S){
        S.icon('secondary','🎁',{label:'$1,000 "Bonus"', anim:'glowgold'});
    }},
    { speaker:'NARRATOR', text:"The customer takes it — happily, willingly, no pressure involved.", enter(S){
        S.flash('DEAL ACCEPTED','var(--gold)');
    }},
    { speaker:'NARRATOR', text:"Doesn't matter. The moment cash or anything of value changes hands beyond what's in the actual policy...", enter(S){
        S.shake();
        S.banner('🚫 REBATE','ILLEGAL — BOTH SIDES');
    }},
    { speaker:'NARRATOR', text:"...it's a rebate. Illegal for the agent to offer, and illegal for the customer to accept, even if nobody twisted anyone's arm.", enter(S){
        S.stamp('secondary','x','ILLEGAL');
    }},
  ]},

{ id:'ceasedesist', title:'THE ORDER THAT<br>SKIPPED THE COURTROOM', hook:'Why a Cease and Desist Order needs no judge.', icon:'📜', mood:'mood-bureau', tag:'ws04 · Cease and Desist',
  endRule:"A Cease and Desist Order is purely <b>administrative</b> — the Commissioner issues it directly once an investigation finds sufficient cause. No judge required. (A hearing to contest it still has to happen, though — no less than 10 days after notice.)",
  beats:[
    { speaker:'NARRATOR', text:"An investigation turns up enough evidence: a producer is violating the Insurance Act.", enter(S){
        S.mood('mood-bureau'); S.icon('main','🔍',{label:'Investigation Complete'});
    }},
    { speaker:'NARRATOR', text:"Does the Commissioner need a judge to sign off before acting?", enter(S){
        S.icon('secondary','⚖️',{label:'Judge?'});
    }},
    { speaker:'COMMISSIONER', text:"\"No. This is administrative authority — I don't need a courtroom for this.\"", enter(S){
        S.stamp('secondary','x','NOT REQUIRED');
        S.banner('NO COURT','REQUIRED');
    }},
    { speaker:'NARRATOR', text:"The Commissioner issues the order directly — sealed, official, and immediate.", enter(S){
        S.icon('secondary','📜',{label:'Cease & Desist Order', anim:'glowgold'});
        S.stamp('secondary','check','ISSUED');
        S.flash('ORDER ISSUED','var(--gold)');
    }},
    { speaker:'NARRATOR', text:"The producer still gets a chance to contest it — a hearing held no less than 10 days after notice. But the order itself needed no court to exist.", enter(S){}},
  ]},

{ id:'gafine', title:'THE FINE THAT<br>KEPT COUNTING', hook:'Unlicensed manager/GA activity and the per-day penalty.', icon:'📅', mood:'mood-stormred', tag:'ws01 · Licensing Fine',
  endRule:"Acting as a manager or exclusive general agent without the right license is a <b>third-degree misdemeanor</b> — and the fine scales <b>up to $1,000 per day</b> the unauthorized activity continues.",
  beats:[
    { speaker:'NARRATOR', text:"A producer starts acting as a manager and exclusive general agent — without ever getting licensed for it.", enter(S){
        S.mood('mood-stormred'); S.icon('main','🧑‍💼',{label:'Unlicensed Activity'});
    }},
    { speaker:'NARRATOR', text:"Day one passes. Nothing happens. He keeps going.", enter(S){
        S.icon('secondary','📅',{label:'Day 1'});
    }},
    { speaker:'NARRATOR', text:"Day two. Day three. Day four. Day five. Every single day, the clock keeps running.", enter(S){
        S.icon('secondary','📅',{label:'Day 5', anim:'punch'});
        S.meter({tag1:'FINE ACCUMULATING', pct1:100, val1:'$1,000 × 5 days'});
    }},
    { speaker:'NARRATOR', text:"This isn't a warning. It's a third-degree misdemeanor, and it's compounding by the day.", enter(S){

        S.flash('$5,000+','var(--danger)');
    }},
  ]},

{ id:'paip', title:'THE HANDSHAKE<br>THAT DIDN\'T COUNT', hook:'PAIP\u2019s one specific way to bind coverage.', icon:'📧', mood:'mood-bureau', tag:'ws15 · PAIP Binding',

  beats:[

        S.stamp('secondary','check','VALID');
        S.flash('COVERAGE BOUND','var(--safe)');

{ id:'propremoved', title:'THE FIVE-DAY RESCUE', hook:'Property removed coverage and its 5-day window.', icon:'📦', mood:'mood-warmnight', tag:'DP-1 \u00b7 Property Removed',
  endRule:"Property removed to protect it from a covered peril is insured against <b>any cause of loss</b>, at <b>any location</b>, for up to <b>5 days</b> — a short, easy-to-miss window baked into every dwelling policy.",

{ id:'twoyear', title:'THE TWO-YEAR<br>DEADLINE', hook:'How long an insured has to sue over a bad settlement.', icon:'⚖️', mood:'mood-bureau', tag:'Legal Action Clause',
  endRule:"If an insured wants to sue over an unfair claim settlement, the clock gives them <b>two years from the date of loss</b> — true on both dwelling and homeowners policies.",
  beats:[

        S.flash('2 YEARS','var(--safe)');
    }},

{ id:'appraiser', title:'THE APPRAISER\'S<br>BLIND SPOT', hook:'What actually sets replacement cost \u2014 and what doesn\'t.', icon:'🧱', mood:'mood-warmnight', tag:'Replacement Value Factors',
  endRule:"Replacement cost is built from <b>construction type, square footage, and location</b> — never market value. What a house would sell for has nothing to do with what it costs to rebuild.",
  beats:[
    { speaker:'NARRATOR', text:"An insurer needs to figure out what this house is actually worth to rebuild.", enter(S){
        S.mood('mood-warmnight'); S.icon('main','🏠',{label:'Valuation Needed'});
    }},
    { speaker:'NARRATOR', text:"They check the type of construction — frame or masonry.", enter(S){
        S.icon('secondary','🧱',{label:'Construction Type'}); S.stamp('secondary','check','USED');
    }},
    { speaker:'NARRATOR', text:"They check the square footage of living space.", enter(S){
        S.icon('secondary','📐',{label:'Square Footage'}); S.stamp('secondary','check','USED');
    }},
    { speaker:'NARRATOR', text:"They check the location — zip code drives labor and material costs.", enter(S){
        S.icon('secondary','📍',{label:'Location'}); S.stamp('secondary','check','USED');
    }},
    { speaker:'NARRATOR', text:"Then someone suggests checking what the house would actually sell for on the open market.", enter(S){
        S.icon('secondary','💰',{label:'Market Value'}); S.stamp('secondary','x','NOT USED');
    }},
    { speaker:'NARRATOR', text:"Market value has zero influence on replacement cost. What a buyer would pay and what it costs to rebuild are two completely different numbers.", enter(S){
        S.flash('IRRELEVANT','var(--danger)');
    }},
  ]},

{ id:'liabilityfollow', title:'THE LIABILITY THAT<br>FOLLOWED HER HOME', hook:'Personal liability supplement: on premises AND off.', icon:'🧍', mood:'mood-stormred', tag:'Personal Liability Supplement',
  endRule:"A personal liability supplement on a dwelling policy follows the <b>person</b>, not the property — it covers bodily injury or property damage from personal activities, <b>both on and off the premises</b>.",

        S.flash('BOTH COUNT','var(--safe)');
    }},
  ]},

{ id:'breakin', title:'THE BREAK-IN NO ONE<br>CALLED IN', hook:'Broad theft coverage\u2019s hidden condition.', icon:'🚔', mood:'mood-stormred', tag:'Broad Theft Coverage',
  endRule:"Broad theft coverage on a dwelling policy comes with a condition attached: the insured has to <b>notify the police</b> if a theft occurs — skip that step, and the claim can be denied.",
  beats:[

        S.flash('REPORT REQUIRED','var(--danger)');
    }},
  ]},

{ id:'earthquake', title:'AFTERSHOCKS &<br>PERCENTAGES', hook:'Earthquake deductibles and the 72-hour occurrence rule.', icon:'🌎', mood:'mood-industrial', tag:'Earthquake Coverage',
  endRule:"Earthquake deductibles run as a <b>percentage of the coverage limit</b>, not a flat dollar figure — and any aftershock within <b>72 hours</b> of the initial quake counts as the same occurrence, not a new one.",
  beats:[
    { speaker:'NARRATOR', text:"The ground shakes. A homeowner's earthquake policy is about to be tested.", enter(S){
        S.mood('mood-industrial'); S.icon('main','🏚️',{label:'Earthquake!'}); S.shake();
    }},
    { speaker:'NARRATOR', text:"First question: what's the deductible here?", enter(S){
        S.icon('secondary','💰',{label:'Deductible = ?'});
    }},
    { speaker:'NARRATOR', text:"It's not a flat $250, $500, or $1,000 like most policies default to.", enter(S){
        S.stamp('secondary','x','NOT FLAT $');
    }},
    { speaker:'EARTHQUAKE CLAUSE', text:"\"My deductible is a percentage of the coverage limit — and it may carry a stated minimum on top of that.\"", enter(S){
        S.formula('EARTHQUAKE DEDUCTIBLE',[
          {text:'<span class="op">%</span> of the Coverage Limit',cls:'result'},
          {text:'(may carry a stated minimum)',cls:'rule'},
        ]);
    }},
    { speaker:'NARRATOR', text:"Four hours later, a strong aftershock hits. Is that a brand new claim?", enter(S){
        S.icon('secondary','🌎',{label:'Aftershock', anim:'punch'});
    }},
    { speaker:'NARRATOR', text:"Not if it's within 72 hours of the original quake — it still counts as the same single occurrence.", enter(S){
        S.flash('SAME OCCURRENCE','var(--safe)');
    }},
  ]},

{ id:'whichform', title:'WHICH FORM<br>ACTUALLY PAYS', hook:'DP-1\u2019s ACV-only rule vs. DP-2/DP-3 replacement cost.', icon:'🏡', mood:'mood-warmnight', tag:'DP-1 vs DP-2/DP-3 Settlement',
  endRule:"DP-1 (Basic) settles losses on <b>Actual Cash Value only — always</b>. DP-2 and DP-3 (Broad and Special) are the only forms offering <b>replacement cost</b>, and only when insured to at least 80%.",
  beats:[
    { speaker:'NARRATOR', text:"Two identical houses, two different dwelling forms. Both are destroyed by fire.", enter(S){
        S.mood('mood-warmnight'); S.icon('main','🏠',{label:'Total Loss ×2'}); S.shake();
    }},
    { speaker:'NARRATOR', text:"House #1 is insured on a DP-1 — the Basic form.", enter(S){
        S.icon('secondary','🏚️',{label:'DP-1 (Basic)'});
    }},
    { speaker:'NARRATOR', text:"No matter what, DP-1 only ever settles on Actual Cash Value — depreciation included, every single time.", enter(S){
        S.stamp('secondary','x','ACV ONLY');
    }},
    { speaker:'NARRATOR', text:"House #2 is insured on a DP-3 — the Special form.", enter(S){
        S.icon('secondary','🏡',{label:'DP-3 (Special)', anim:'glowgreen'});
    }},
    { speaker:'NARRATOR', text:"DP-2 and DP-3 are the only forms that pay full replacement cost — as long as the home is insured to at least 80% of that cost.", enter(S){
        S.stamp('secondary','check','REPLACEMENT COST');
    }},
    { speaker:'NARRATOR', text:"Same fire, same total loss — two completely different checks, decided entirely by which form was on the policy.", enter(S){
        S.flash('ONLY DP-2 & DP-3','var(--safe)');
    }},
  ]},

{ id:'construction', title:'BUILDING AT ZERO,<br>INSURED AT 100%', hook:'Under-construction coverage and DP-1\u2019s $0 minimum.', icon:'🏗️', mood:'mood-industrial', tag:'Under Construction + $0 Minimum',
  endRule:"A dwelling under construction is covered for its <b>actual value on the date of completion</b> — and separately, a DP-1 Basic form has <b>no minimum dollar coverage requirement</b> at all: $0 is technically allowed.",
  beats:[

        S.mood('mood-industrial'); S.icon('main','🏗️',{label:'Under Construction'});

        S.icon('secondary','❓',{label:'Coverage Limit = ?'});
    }},
    { speaker:'NARRATOR', text:"Not the projected replacement cost once it's finished. Not an average value across the build.", enter(S){
        S.stamp('secondary','x','NOT PROJECTED');
    }},
    { speaker:'UNDER-CONSTRUCTION RULE', text:"\"I'm insured for actual value on the date of completion — 100% of the completed value, no more, no less.\"", enter(S){
        S.formula('UNDER-CONSTRUCTION RULE',[
          {text:'Insured for <span class="op">Actual Value</span>',cls:''},
          {text:'on the Date of Completion',cls:'result'},
        ]);
    }},
    { speaker:'NARRATOR', text:"Meanwhile, over on a finished DP-1 Basic form, there's a separate surprise: the minimum dollar coverage requirement is...", enter(S){
        S.icon('secondary','📉',{label:'Minimum Required?'});
    }},
    { speaker:'NARRATOR', text:"Zero. There is no minimum dollar amount required on a Basic form policy at all.", enter(S){
        S.flash('$0 MINIMUM','var(--gold)');
    }},

{ id:'vandalism', title:'VANDALS DON\'T GET<br>THE EXTENSION', hook:'Extended coverage\u2014everything except vandalism.', icon:'🎨', mood:'mood-warning', tag:'Extended Coverage — Except Vandalism',
  endRule:"Extended coverage adds windstorm, explosion, and riot damage onto a Basic dwelling form — but <b>vandalism</b> is the one peril left out of that list.",
  beats:[
    { speaker:'NARRATOR', text:"A homeowner pays extra to add extended coverage onto her Basic dwelling form.", enter(S){

    }},

{ id:'othercoverage', title:'THE COVERAGE THAT<br>WASN\'T AUTOMATIC', hook:'"Other coverage" vs. additional living expenses.', icon:'🏨', mood:'mood-medical', tag:'"Other Coverage" — Except ALE',
  endRule:"Collapse, debris removal, and fire department service charges are all <b>automatically included</b> as \"other coverage\" on a dwelling policy. Additional living expenses is different — it's a coverage <b>part</b> that has to be added on.",
  beats:[
    { speaker:'NARRATOR', text:"A dwelling policy comes with a handful of coverages baked in automatically — no extra premium needed.", enter(S){
        S.mood('mood-medical'); S.icon('main','📜',{label:'Dwelling Policy'});
    }},
    { speaker:'NARRATOR', text:"Collapse coverage — included.", enter(S){
        S.icon('secondary','🏚️',{label:'Collapse'}); S.stamp('secondary','check','AUTOMATIC');
    }},
    { speaker:'NARRATOR', text:"Debris removal — included.", enter(S){
        S.icon('secondary','🧹',{label:'Debris Removal'}); S.stamp('secondary','check','AUTOMATIC');
    }},
    { speaker:'NARRATOR', text:"Fire department service charges — included.", enter(S){
        S.icon('secondary','🚒',{label:'FD Service Charges'}); S.stamp('secondary','check','AUTOMATIC');
    }},
    { speaker:'NARRATOR', text:"Additional living expenses — covering a hotel stay while the house gets rebuilt?", enter(S){

    { speaker:'NARRATOR', text:"That one's different. It's a coverage part that has to be added onto a Broad or Special form — not something baked in automatically.", enter(S){
        S.stamp('secondary','x','ADD-ON ONLY');
        S.flash('NOT AUTOMATIC','var(--danger)');
    }},
  ]},

{ id:'explosion', title:'INTERNAL VS.<br>EXTERNAL', hook:'Why "explosion" and "internal explosion" aren\u2019t the same peril.', icon:'💥', mood:'mood-warmnight', tag:'DP-1 and the Explosion Peril',
  endRule:"DP-1 Basic covers <b>internal explosion</b> as a named peril — but general \"explosion\" (like an external blast) only comes in with extended coverage. The word \"internal\" is doing a lot of work in that sentence.",
  beats:[
    { speaker:'NARRATOR', text:"A furnace malfunctions and blows apart inside the basement.", enter(S){
        S.mood('mood-warmnight'); S.icon('main','🏠',{label:'Internal Explosion'}); S.shake();
    }},
    { speaker:'NARRATOR', text:"Covered under the Basic form? Fire, lightning, and internal explosion are all named perils on DP-1 — yes.", enter(S){
        S.stamp('main','check','COVERED (DP-1)');
    }},
    { speaker:'NARRATOR', text:"Now picture a different scene: a gas main explodes out on the street, and the shockwave damages the house.", enter(S){
        S.icon('secondary','💥',{label:'External Explosion', anim:'punch'});
    }},
    { speaker:'NARRATOR', text:"Same word — \"explosion\" — but this one didn't happen inside the structure.", enter(S){}},
    { speaker:'NARRATOR', text:"General explosion coverage isn't part of the Basic form's named perils. That one only shows up once extended coverage gets added.", enter(S){
        S.stamp('secondary','x','NOT ON DP-1');
        S.flash('EXTENDED COVERAGE ONLY','var(--danger)');
    }},
  ]},

{ id:'autoincrease', title:'THE ENDORSEMENT<br>THAT GROWS WITH YOU', hook:'Automatic Increase in Insurance vs. the "Replacement Cost" trap.', icon:'📈', mood:'mood-warning', tag:'Automatic Increase in Insurance',
  endRule:"The endorsement that keeps a Dwelling Property policy's limit rising with inflation is called <b>Automatic Increase in Insurance</b> — on a Homeowners policy, the same idea is branded \"Inflation Guard\" instead.",
  beats:[

    }},

    { speaker:'NARRATOR', text:"Is it called \"Replacement Cost\"?", enter(S){
        S.icon('secondary','❓',{label:'Replacement Cost?'});
        S.stamp('secondary','x','WRONG ENDORSEMENT');
    }},
    { speaker:'NARRATOR', text:"No — that's a different feature entirely. This one is called Automatic Increase in Insurance.", enter(S){
        S.icon('secondary','📈',{label:'Automatic Increase in Insurance', anim:'glowgold'});
        S.stamp('secondary','check','CORRECT');
    }},

        S.flash('LIMIT KEEPS PACE','var(--safe)');
    }},
  ]},

{ id:'fourforms', title:'THE FOUR<br>REBUILDING PROMISES', hook:'HO-2 vs. HO-3 vs. HO-5 vs. HO-8, side by side.', icon:'🏘️', mood:'mood-warmnight', tag:'HO-2 / HO-3 / HO-5 / HO-8',
  endRule:"HO-2 (Broad) is named-peril on both dwelling and contents. HO-3 (Special) is open-peril on the dwelling but named-peril / ACV on contents. HO-5 (Comprehensive) is open-peril on <b>both</b>. HO-8 (Modified) settles everything at <b>Actual Cash Value</b>, never replacement cost.",
  beats:[

        S.icon('secondary','🏚️',{label:'HO-2 (Broad)'});
    }},
    { speaker:'NARRATOR', text:"Broad form means named-peril coverage on BOTH the dwelling and the contents — nothing open-ended here.", enter(S){
        S.stamp('secondary','check','NAMED PERIL — BOTH');
    }},
    { speaker:'NARRATOR', text:"House #2 carries an HO-3 — the Special form. The most common policy out there.", enter(S){
        S.icon('secondary','🏡',{label:'HO-3 (Special)'});
    }},
    { speaker:'NARRATOR', text:"Special form flips the structure: open-peril on the dwelling, but only named-peril coverage — at ACV — on the contents.", enter(S){
        S.stamp('secondary','check','OPEN PERIL DWELLING / NAMED CONTENTS');
    }},
    { speaker:'NARRATOR', text:"House #3 carries an HO-5 — the Comprehensive form.", enter(S){
        S.icon('secondary','🏠',{label:'HO-5 (Comprehensive)', anim:'glowgreen'});
    }},
    { speaker:'NARRATOR', text:"HO-5 is the only form that goes open-peril on EVERYTHING — dwelling and contents both.", enter(S){
        S.stamp('secondary','check','OPEN PERIL — BOTH');
    }},
    { speaker:'NARRATOR', text:"House #4 carries an HO-8 — the Modified form, often used on older homes.", enter(S){
        S.icon('secondary','🏚️',{label:'HO-8 (Modified)'});
    }},
    { speaker:'NARRATOR', text:"HO-8 settles every claim at Actual Cash Value — never replacement cost, no matter what's damaged.", enter(S){
        S.stamp('secondary','x','ACV ONLY');
        S.flash('FOUR FORMS, FOUR OUTCOMES','var(--gold)');
    }},

{ id:'personalinjury', title:'THE UNINVITED GUEST', hook:'The personal injury endorsement\u2014and its intent problem.', icon:'🧍', mood:'mood-stormred', tag:'Personal Injury Endorsement',
  endRule:"The personal injury endorsement covers wrongful entry, libel, slander, invasion of privacy, and malicious prosecution — but never anything intentional. False arrest only counts if it happens by accident, not on purpose.",

{ id:'multiline', title:'WHAT THE PACKAGE<br>ACTUALLY PACKAGES', hook:'Homeowners bundling\u2014and the snowmobile exception.', icon:'📦', mood:'mood-warning', tag:'Multi-Line Package — Snowmobile',
  endRule:"A Homeowners policy bundles property and liability together — but recreational vehicles like snowmobiles owned by the insured are excluded from the property side entirely, even though a dog bite or an abrupt roof collapse is covered.",
  beats:[

        S.mood('mood-warning'); S.icon('main','📦',{label:'Package Policy'});
    }},
    { speaker:'NARRATOR', text:"The roof suddenly caves in — covered.", enter(S){
        S.icon('secondary','🏚️',{label:'Roof Collapse'}); S.stamp('secondary','check','COVERED');

    { speaker:'NARRATOR', text:"The dog bites a visitor — covered under liability.", enter(S){
        S.icon('secondary','🐕',{label:'Dog Bite Liability'}); S.stamp('secondary','check','COVERED');

    { speaker:'NARRATOR', text:"Business equipment stored off-site gets damaged — covered, up to a limit.", enter(S){

{ id:'filingcabinet', title:'THE FILING CABINET', hook:'Section I vs. Section II\u2014what lives where.', icon:'🗄️', mood:'mood-bureau', tag:'Section I vs. Section II',
  endRule:"Appraisal lives only in Section I (property) — liability disagreements go to arbitration instead. And personal injury, while real Section II coverage, isn't filed under \"additional coverages\" — that list is first aid, damage to property of others, and claims expenses.",
  beats:[
    { speaker:'NARRATOR', text:"Every Homeowners policy splits cleanly into two filing cabinets: Section I for property, Section II for liability.", enter(S){
        S.mood('mood-bureau'); S.icon('main','🗄️',{label:'Section I / Section II'});
    }},
    { speaker:'NARRATOR', text:"A property claim goes sideways — insurer and insured can't agree on the value of the loss.", enter(S){
        S.icon('secondary','🏠',{label:'Property Disagreement'});
    }},
    { speaker:'NARRATOR', text:"They reach for Appraisal to settle it.", enter(S){
        S.stamp('secondary','check','SECTION I ONLY');
    }},
    { speaker:'NARRATOR', text:"Try that same move on a liability disagreement, and it doesn't exist there — Section II uses Arbitration instead.", enter(S){
        S.icon('secondary','⚖️',{label:'Liability Disagreement'});
        S.stamp('secondary','x','NO APPRAISAL HERE');
    }},
    { speaker:'NARRATOR', text:"Meanwhile, over in Section II's \"additional coverages\" folder: first aid expenses, damage to property of others, claims expenses.", enter(S){
        S.icon('secondary','📁',{label:'Additional Coverages'});
        S.stamp('secondary','check','LISTED');
    }},
    { speaker:'NARRATOR', text:"Personal injury coverage is real, and it's really in Section II — it just isn't filed in that particular folder.", enter(S){
        S.icon('secondary','🧍',{label:'Personal Injury', anim:'punch'});
        S.stamp('secondary','x','DIFFERENT FOLDER');
        S.flash('REAL COVERAGE, WRONG LIST','var(--danger)');
    }},
  ]},

{ id:'worldwide', title:'THE WORLDWIDE<br>HANDSHAKE', hook:'Why Section II liability never stays home.', icon:'🌍', mood:'mood-stormred', tag:'Section II — Worldwide Reach',
  endRule:"Section II liability is identical across every HO form — including HO-8. Personal (non-business) activities are covered worldwide, not just on the insured's premises.",
  beats:[
    { speaker:'NARRATOR', text:"A family with an HO-8 policy — an older, more basic form — heads out on vacation.", enter(S){
        S.mood('mood-stormred'); S.icon('main','🧳',{label:'HO-8 Policy, On Vacation'});
    }},
    { speaker:'NARRATOR', text:"Two states away, the insured accidentally injures someone while golfing.", enter(S){
        S.icon('secondary','⛳',{label:'Accident — Out of State', anim:'punch'});
    }},
    { speaker:'NARRATOR', text:"Does an HO-8's liability coverage even reach that far?", enter(S){
        S.banner('❓ WORLDWIDE OR PREMISES ONLY?','');
    }},
    { speaker:'NARRATOR', text:"Section II liability is identical across every single HO form — HO-8 included. None of them limit it to the property line.", enter(S){
        S.stamp('secondary','check','COVERED');
    }},
    { speaker:'NARRATOR', text:"Personal, non-business activities are covered worldwide, full stop. What actually differs between HO forms is Section I — the property side, not liability.", enter(S){
        S.flash('WORLDWIDE COVERAGE','var(--safe)');
    }},
  ]},

{ id:'coveredproperty', title:'WHAT COUNTS AS<br>COVERED PROPERTY', hook:'Assistive vehicles, boarders, and property held for rent.', icon:'🦽', mood:'mood-medical', tag:'Section I \u2014 Covered vs. Excluded Property',
  endRule:"Motorized vehicles are excluded from Section I — except ones designed to assist a handicapped person or ones that service the residence itself. Property held for rental elsewhere and a boarder's belongings are excluded outright; theirs is a job for a separate HO-4 policy.",
  beats:[
    { speaker:'NARRATOR', text:"Section I covers personal property — but a few categories get carved out entirely.", enter(S){
        S.mood('mood-medical'); S.icon('main','📋',{label:'Section I — Personal Property'});
    }},
    { speaker:'NARRATOR', text:"A sofa the insured owns, sitting in a rental unit down the street.", enter(S){
        S.icon('secondary','🛋️',{label:'Sofa at Rental Property', anim:'punch'});
    }},
    { speaker:'NARRATOR', text:"Property held for rental elsewhere isn't covered under this policy.", enter(S){
        S.stamp('secondary','x','EXCLUDED');
    }},
    { speaker:'NARRATOR', text:"A boarder living in the insured's home has his own belongings in his room.", enter(S){
        S.icon('secondary','🎒',{label:'Boarder\u2019s Property'});
    }},
    { speaker:'NARRATOR', text:"Not covered either — a boarder needs his own HO-4 renter's policy for that.", enter(S){
        S.stamp('secondary','x','EXCLUDED');
    }},
    { speaker:'NARRATOR', text:"But Grandma's motorized scooter, the one that helps her get around the house?", enter(S){
        S.icon('secondary','🦽',{label:'Motorized Scooter (Assistive)', anim:'glowgreen'});
    }},
    { speaker:'NARRATOR', text:"That one's the exception. Vehicles designed to assist a handicapped person are covered — motorized doesn't automatically mean excluded.", enter(S){
        S.stamp('secondary','check','COVERED');
        S.flash('THE ASSISTIVE EXCEPTION','var(--safe)');
    }},
  ]},

{ id:'termite', title:'THE SLOW-MOTION<br>TERMITE', hook:'Even open-peril coverage has a limit.', icon:'🐛', mood:'mood-warmnight', tag:'HO-5 — Known Deterioration',
  endRule:"HO-5 is open-peril, but open-peril coverage is defined by what it excludes — and known, gradual deterioration like termite damage isn't covered once the insured had reason to know about it.",
  beats:[
    { speaker:'NARRATOR', text:"An HO-5 policy is about as broad as Homeowners coverage gets — open peril, on everything.", enter(S){
        S.mood('mood-warmnight'); S.icon('main','🏠',{label:'HO-5 — Comprehensive'});
    }},
    { speaker:'NARRATOR', text:"So when strange things happen — a fume explosion, even an alien spaceship landing on the roof — the open-peril structure covers it.", enter(S){
        S.icon('secondary','🛸',{label:'The Unexpected'});
        S.stamp('secondary','check','COVERED (OPEN PERIL)');
    }},
    { speaker:'NARRATOR', text:"But then: the insured notices wood shavings in the basement. For years. And does nothing about it.", enter(S){
        S.icon('secondary','🪵',{label:'Wood Shavings — Ignored'});
    }},
    { speaker:'NARRATOR', text:"Eventually part of the structure collapses. Termite damage, the whole way through.", enter(S){
        S.icon('secondary','🐛',{label:'Termite Collapse', anim:'shatter'});
    }},
    { speaker:'NARRATOR', text:"Open peril doesn't mean unlimited. Known, gradual deterioration the insured had reason to be aware of isn't a covered peril — no matter how open the form is.", enter(S){
        S.stamp('secondary','x','NOT COVERED');
        S.flash('KNOWN DAMAGE, NO COVERAGE','var(--danger)');
    }},
  ]},

{ id:'daycare', title:'SOMEONE ELSE\'S KID', hook:'Where the Home Day Care endorsement actually reaches.', icon:'🛝', mood:'mood-medical', tag:'Home Day Care Endorsement',

{ id:'heatingsystem', title:'THE PERIL BOTH<br>FORMS SHARE', hook:'A named peril HO-2 and HO-3 have in common.', icon:'🏘️', mood:'mood-industrial', tag:'HO-2 & HO-3 — Shared Named Peril',

{ id:'wallcollapse', title:'THE WALL THAT<br>CAME BACK', hook:'The completed operations hazard, years later.', icon:'🧱', mood:'mood-stormred', tag:'ws41 · Completed Operations',
  endRule:"The completed operations hazard means a contractor's finished work can still trigger a claim years later — and the CGL insurer must defend the suit no matter the outcome. It's not product liability, and there's no statute-of-limitations shortcut.",
  beats:[
    { speaker:'NARRATOR', text:"Years ago, a contractor built a retaining wall. The job was signed off, paid, and forgotten.", enter(S){
        S.mood('mood-stormred'); S.icon('main','👷',{label:'Wall Built — Years Ago'});
    }},
    { speaker:'NARRATOR', text:"Today, that wall collapses. A child playing nearby is hurt. A lawsuit lands on the contractor's desk.", enter(S){
        S.shake(); S.icon('secondary','🧱',{label:'Wall Collapses', anim:'shatter'});
        S.banner('⚖️ LAWSUIT FILED!','OLD WORK, NEW CLAIM');
    }},
    { speaker:'CONTRACTOR', text:"\"It's been years — surely the statute of limitations covers me?\"", enter(S){
        S.stamp('main','x','NO SHORTCUT');
    }},
    { speaker:'NARRATOR', text:"It doesn't work that way. This is the completed operations hazard — finished work can still trigger a claim long after the job's done.", enter(S){
        S.icon('secondary','📜',{label:'Completed Operations Hazard'});
    }},
    { speaker:'CGL INSURER', text:"\"I have to defend this suit — no matter how it turns out.\"", enter(S){
        S.stamp('secondary','check','DEFENSE OBLIGATED');
        S.flash('INSURER MUST DEFEND','var(--safe)');
    }},
    { speaker:'NARRATOR', text:"Not product liability — that's for manufactured goods. Not personal injury coverage — that's for things like libel. This is completed operations, plain and simple.", enter(S){}},
  ]},

{ id:'blackoutmeat', title:'THE BLACKOUT<br>SIX BLOCKS AWAY', hook:'Off-premises power failure and the Time Element gap.', icon:'🔌', mood:'mood-industrial', tag:'ws42 · Utility Services Time Element',
  endRule:"Off-premises power interruption is excluded under the standard BOP — the Utility Services Time Element endorsement (BP 04 57) is the specific fix. Without it, an off-site outage leaves income loss uncovered.",

        S.stamp('secondary','x','EXCLUDED');

        S.icon('secondary','🔧',{label:'Utility Services — Time Element', anim:'glowgold'});
        S.flash('THE MISSING ENDORSEMENT','var(--danger)');
    }},
  ]},

{ id:'underground', title:'WHAT\'S BURIED<br>STAYS EXCLUDED', hook:'The BOP\'s land and underground exclusion.', icon:'🕳️', mood:'mood-warmnight', tag:'ws43 · BOP Property Exclusions',
  endRule:"Land and anything buried in it — underground pipes, flues, and drains — sit outside every standard BOP, no matter what's connected to them above ground.",

    }},
  ]},

{ id:'poormanscomp', title:'THE POOR MAN\'S<br>COMPREHENSIVE', hook:'Specified Cause of Loss as the BAP alternative.', icon:'🚚', mood:'mood-warning', tag:'ws44 · BAP Physical Damage',

{ id:'burglardp', title:'THE BURGLAR AND<br>THE BUILDING', hook:'DP-2 Broad form: theft of stuff vs. damage from a break-in.', icon:'🚪', mood:'mood-stormred', tag:'ws45 · DP Broad Cause of Loss',

{ id:'nolimitmed', title:'THE BILL WITH<br>NO CEILING', hook:'Workers\' Comp medical benefits carry no dollar cap.', icon:'🏥', mood:'mood-medical', tag:'ws46 · Workers\' Comp Benefits',

{ id:'premiseslia', title:'THE FENCE LINE<br>OF COVERAGE', hook:'Premises liability vs. personal liability on a DP.', icon:'🚧', mood:'mood-warmnight', tag:'ws48 · DP Premises Liability',
  endRule:"The premises liability endorsement only follows the insured on the property itself. Personal liability is the broader option that follows them everywhere, on and off premises.",
  beats:[
    { speaker:'NARRATOR', text:"A homeowner insured on a Dwelling Property policy wants liability coverage — but only worries about exposure right on the property.", enter(S){

    }},

  ]},

{ id:'obligeepromise', title:'THE PROMISE<br>THAT WAS OWED', hook:'The Obligee as the bond\'s promisee.', icon:'🤝', mood:'mood-bureau', tag:'ws49 · Surety Bonds — Obligee',
  endRule:"The obligee is the party a bond's promise was made TO — the one who receives the payout if the principal defaults. The principal is the promisor; the surety guarantees the promise.",
  beats:[
    { speaker:'NARRATOR', text:"A surety bond has three parties. One of them is owed a promise — the promisee.", enter(S){
        S.mood('mood-bureau'); S.icon('main','📜',{label:'Surety Bond — 3 Parties'});
    }},
    { speaker:'NARRATOR', text:"The principal makes the promise to perform. The surety backs that promise financially.", enter(S){
        S.icon('secondary','👷',{label:'Principal: The Promisor'});
    }},
    { speaker:'NARRATOR', text:"And the third party — the one the promise was actually made TO — is the obligee.", enter(S){
        S.icon('secondary','🤝',{label:'Obligee: The Promisee', anim:'glowgold'});
        S.stamp('secondary','check','THE PROMISEE');
    }},
    { speaker:'NARRATOR', text:"If the principal defaults, it's the obligee who receives the bond proceeds — they're the one who was owed something in the first place.", enter(S){

    }},
  ]},

{ id:'income72', title:'THE 72-HOUR<br>WAITING ROOM', hook:'Business Income\'s time deductible.', icon:'⏱️', mood:'mood-industrial', tag:'ws50 · Business Income Deductible',

{ id:'ho3split', title:'THE HALFWAY<br>HOUSE FORM', hook:'HO-3: open peril on the dwelling, broad form on contents.', icon:'🏘️', mood:'mood-warmnight', tag:'ws51 · HO-3 Real Property vs Contents',
  endRule:"HO-3 splits its coverage down the middle: open-peril (all risk) protection on real property like the dwelling, but named-peril (broad form) coverage on personal property/contents.",
  beats:[

        S.mood('mood-warmnight'); S.icon('main','🏘️',{label:'Homeowners Forms'});
    }},
    { speaker:'NARRATOR', text:"One form splits its coverage right down the middle — wide open on the building, narrower on the stuff inside it.", enter(S){

{ id:'theftchoice', title:'TWO DOORS,<br>ONE CHOICE', hook:'Owner occupant theft: limited or broad, not either/or eligibility.', icon:'🔐', mood:'mood-stormred', tag:'ws52 · DP Owner Occupant Theft',

{ id:'principalperform', title:'THE ONE WHO<br>HAS TO SHOW UP', hook:'Principal = the party who performs.', icon:'🔨', mood:'mood-bureau', tag:'ws54 · Bond Principal',

{ id:'pa153005', title:'THE 15/30/5<br>SAFETY NET', hook:'PA\'s state-minimum auto liability limits.', icon:'🚗', mood:'mood-industrial', tag:'ws55 + ws56 · PA State Minimum Auto Limits',
  endRule:"Pennsylvania's state-required minimum auto liability is 15/30/5 — $15,000 per person, $30,000 per accident for bodily injury, and $5,000 for property damage.",
  beats:[

  ]},

{ id:'addresschange', title:'THE ADDRESS<br>NOBODY UPDATED', hook:'Change-of-address failure as a Prohibited Act.', icon:'📬', mood:'mood-bureau', tag:'ws57 · Producer Duties — Address Change',

{ id:'knowingfine', title:'THE FINE THAT<br>KNEW BETTER', hook:'Knowing unfair competition: the steeper fine tier.', icon:'💰', mood:'mood-stormred', tag:'ws58 · Unfair Competition Fines',

{ id:'secondinjuryfund', title:'THE FUND THAT<br>REMOVES THE FEAR', hook:"Why the disabled still get hired.", icon:'🤝', mood:'mood-medical', tag:'ws61 · Second Injury Fund',
  endRule:"The second injury fund pays for second and subsequent injuries to an already-disabled worker, without charging that cost against the employer's experience rating — removing the financial disincentive to hire the disabled.",

{ id:'inventoryshortage', title:'THE SHORTAGE<br>THAT ISN\'T PROOF', hook:"Employee Dishonesty won't pay on inventory shortage alone.", icon:'📦', mood:'mood-warning', tag:'ws63 · Employee Dishonesty Proof',

        S.icon('secondary','📋',{label:'Filing a Claim'});

        S.icon('secondary','🛡️',{label:'Employee Dishonesty Form'});

{ id:'driveothercar', title:'THE ENDORSEMENT<br>FOR ANYBODY\'S CAR', hook:"BAP\'s Drive Other Car coverage.", icon:'🔑', mood:'mood-industrial', tag:'ws64 · BAP Drive Other Car',

  endRule:"Transfer of rights of recovery — commonly called subrogation — is when the insured signs over their right to sue the at-fault party to the insurer, preventing a double recovery on the same loss.",
  beats:[
    { speaker:'NARRATOR', text:"A driver is hit by a negligent third party. Her own insurer pays the claim right away.", enter(S){
        S.mood('mood-bureau'); S.icon('main','🚗',{label:'Insured Paid by Own Insurer'});

        S.icon('secondary','⚖️',{label:'Double Recovery?', anim:'punch'});
    }},
    { speaker:'NARRATOR', text:"No — she signs over her right of action against the at-fault party to her own insurer. That's the transfer of rights of recovery.", enter(S){

        S.stamp('secondary','check','SUBROGATION');

    { speaker:'NARRATOR', text:"This exists specifically to stop the insured from collecting twice on the same loss. Indemnification is a related idea, but it's about the payment itself — this is about who gets to sue whom afterward.", enter(S){

// ---- persistent echo/delay send, built once and reused for every ambient note ----
let ambientDelay=null, ambientFeedback=null, ambientWet=null, ambientFXReady=false;
function ensureAmbientFX(){
  const ctx=ensureAudioCtx();
  if(!ctx || ambientFXReady) return;
  try{
    ambientDelay=ctx.createDelay(1.0);
    ambientDelay.delayTime.value=0.34; // a dotted, bouncy repeat rather than a straight slapback
    ambientFeedback=ctx.createGain();
    ambientFeedback.gain.value=0.4; // a handful of audible repeats before it fades
    ambientWet=ctx.createGain();
    ambientWet.gain.value=0.55;
    ambientDelay.connect(ambientFeedback);
    ambientFeedback.connect(ambientDelay);
    ambientDelay.connect(ambientWet);
    ambientWet.connect(ctx.destination);
    ambientFXReady=true;
  }catch(e){}
}
function playAmbientTone(freq, startOffset, duration, type, gainVal, vibrato){
  if(sfxMuted) return;
  const ctx=ensureAudioCtx();
  if(!ctx) return;
  ensureAmbientFX();
  try{
    const osc=ctx.createOscillator();
    const gain=ctx.createGain();
    osc.type=type||'triangle';
    osc.frequency.value=freq;
    const t0=ctx.currentTime+Math.max(0,startOffset);
    gain.gain.setValueAtTime(0.0001,t0);
    gain.gain.linearRampToValueAtTime(gainVal||0.04, t0+0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0+duration);
    osc.connect(gain);
    gain.connect(ctx.destination);            // dry
    if(ambientDelay) gain.connect(ambientDelay); // wet send — the echo
    let lfo=null;
    if(vibrato){
      lfo=ctx.createOscillator();
      lfo.type='sine'; lfo.frequency.value=4.8;
      const lfoGain=ctx.createGain(); lfoGain.gain.value=4.5; // gentle underwater wobble, a few Hz of wander
      lfo.connect(lfoGain); lfoGain.connect(osc.frequency);
      lfo.start(t0); lfo.stop(t0+duration+0.05);
    }
    osc.start(t0); osc.stop(t0+duration+0.05);
  }catch(e){}
}
// ---- pitch-sweep tone — for glide-y imitation sounds (a meow's rise-and-fall,
// an engine rev, a screech) that a static frequency can't produce ----
function playSweep(startOffset, points, duration, gainVal, type){
  if(sfxMuted) return;
  const ctx=ensureAudioCtx();
  if(!ctx) return;
  ensureAmbientFX();
  try{
    const osc=ctx.createOscillator();
    const gain=ctx.createGain();
    osc.type=type||'sine';
    const t0=ctx.currentTime+Math.max(0,startOffset);
    osc.frequency.setValueAtTime(points[0].freq, t0);
    points.slice(1).forEach(p=>{ osc.frequency.linearRampToValueAtTime(p.freq, t0+p.t); });
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.linearRampToValueAtTime(gainVal||0.05, t0+0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0+duration);
    osc.connect(gain);
    gain.connect(ctx.destination);
    if(ambientDelay) gain.connect(ambientDelay);
    osc.start(t0); osc.stop(t0+duration+0.05);
  }catch(e){}
}
// ---- white-noise burst, filtered — for barks, screeches, clicks, chatter texture ----
let noiseBuffer=null;
function ensureNoiseBuffer(){
  const ctx=ensureAudioCtx();
  if(!ctx || noiseBuffer) return;
  try{
    const len=ctx.sampleRate*1; // 1 second, reused for every hit
    noiseBuffer=ctx.createBuffer(1, len, ctx.sampleRate);
    const data=noiseBuffer.getChannelData(0);
    for(let i=0;i<len;i++){ data[i]=Math.random()*2-1; }
  }catch(e){}
}
function playNoiseHit(startOffset, duration, gainVal, filterType, freqStart, freqEnd, q){
  if(sfxMuted) return;
  const ctx=ensureAudioCtx();
  if(!ctx) return;
  ensureNoiseBuffer();
  if(!noiseBuffer) return;
  try{
    const src=ctx.createBufferSource();
    src.buffer=noiseBuffer;
    const filter=ctx.createBiquadFilter();
    filter.type=filterType||'bandpass';
    const t0=ctx.currentTime+Math.max(0,startOffset);
    filter.frequency.setValueAtTime(freqStart, t0);
    if(freqEnd && freqEnd!==freqStart) filter.frequency.linearRampToValueAtTime(freqEnd, t0+duration);
    if(q) filter.Q.value=q;
    const gain=ctx.createGain();
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.linearRampToValueAtTime(gainVal||0.06, t0+0.008);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0+duration);
    src.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
    src.start(t0); src.stop(t0+duration+0.02);
  }catch(e){}
}
function playOverworldBar(leadPattern, bassPattern){
  leadPattern.forEach(n=>{ playAmbientTone(n.freq, n.step*SIXTEENTH, 0.2, 'triangle', 0.038); });
  bassPattern.forEach(n=>{ playAmbientTone(n.freq, n.step*SIXTEENTH, 0.26, 'triangle', 0.032); });
}
function playUnderwaterBar(leadPattern, bassPattern){
  leadPattern.forEach(n=>{ playAmbientTone(n.freq, n.step*UNDER_STEP, 0.85, 'sine', 0.032, true); });
  bassPattern.forEach(n=>{ playAmbientTone(n.freq, n.step*UNDER_STEP, 2.3, 'sine', 0.03, true); });
}
function playEpicBar(leadPattern, bassPattern){
  leadPattern.forEach(n=>{ playAmbientTone(n.freq, n.step*EPIC_STEP, n.dur, 'sawtooth', 0.05); });
  bassPattern.forEach(n=>{ playAmbientTone(n.freq, n.step*EPIC_STEP, n.dur, 'sawtooth', 0.045); });
}
function playGeneralBar(leadPattern, bassPattern){
  leadPattern.forEach(n=>{ playAmbientTone(n.freq, n.step*GENERAL_STEP, 0.26, 'triangle', 0.042); });
  bassPattern.forEach(n=>{ playAmbientTone(n.freq, n.step*GENERAL_STEP, 0.34, 'triangle', 0.036); });
}

// ---- Homeowners soundscape — flatter than the melodic chapters on
// purpose: no song, just imitation domestic sounds drifting through ----
function playDoorbell(){
  playAmbientTone(659.25, 0, 0.3, 'sine', 0.05);     // ding
  playAmbientTone(523.25, 0.28, 0.45, 'sine', 0.05); // dong
}
function playDogBark(){
  playNoiseHit(0, 0.11, 0.09, 'bandpass', 500, 350, 4);
  playNoiseHit(0.16, 0.1, 0.08, 'bandpass', 480, 320, 4);
}
function playCatMeow(){
  playSweep(0, [{t:0,freq:480},{t:0.14,freq:760},{t:0.4,freq:340}], 0.42, 0.045, 'sawtooth');
}
function playBirdChirp(){
  playSweep(0,    [{t:0,freq:2200},{t:0.05,freq:3000}], 0.07, 0.032, 'sine');
  playSweep(0.11, [{t:0,freq:2400},{t:0.05,freq:3200}], 0.07, 0.028, 'sine');
  playSweep(0.24, [{t:0,freq:2000},{t:0.04,freq:2800}], 0.06, 0.028, 'sine');
}
function playChatter(){
  const count=4+Math.floor(Math.random()*3);
  let t=0;
  for(let i=0;i<count;i++){
    const f=160+Math.random()*140;
    playAmbientTone(f, t, 0.05+Math.random()*0.03, 'triangle', 0.02);
    t+=0.07+Math.random()*0.09;
  }
}
const HOME_SOUNDS=[playDoorbell, playDogBark, playCatMeow, playBirdChirp, playChatter];

// ---- Auto soundscape — same flat, sound-effect-driven idea as Homeowners,
// but with imitation car noises instead, like an old racing game's world ----
function playCarHorn(){
  playAmbientTone(440, 0, 0.22, 'sawtooth', 0.05);
  playAmbientTone(440, 0.3, 0.22, 'sawtooth', 0.05);
}
function playEngineRev(){
  playSweep(0, [{t:0,freq:80},{t:0.35,freq:220},{t:0.5,freq:140}], 0.55, 0.045, 'sawtooth');
}
function playBlinkerClick(){
  playNoiseHit(0, 0.02, 0.05, 'bandpass', 1200, 1200, 8);
  playNoiseHit(0.16, 0.02, 0.05, 'bandpass', 1200, 1200, 8);
}
function playTireScreech(){
  playNoiseHit(0, 0.5, 0.06, 'bandpass', 2600, 900, 6);
  playSweep(0, [{t:0,freq:900},{t:0.5,freq:400}], 0.5, 0.018, 'sawtooth');
}
const AUTO_SOUNDS=[playCarHorn, playEngineRev, playBlinkerClick, playTireScreech];
function scheduleAmbient(){
  if(!ambientActive || sfxMuted) return;
  let barDuration;
  if(ambientMode==='home'){
    const fn=HOME_SOUNDS[Math.floor(Math.random()*HOME_SOUNDS.length)];
    fn();
    barDuration=1.6+Math.random()*2.8; // sparse, irregular — a house, not a song
  } else if(ambientMode==='auto'){
    const fn=AUTO_SOUNDS[Math.floor(Math.random()*AUTO_SOUNDS.length)];
    fn();
    barDuration=1.4+Math.random()*2.6;
  } else if(ambientMode==='general'){
    barDuration=16*GENERAL_STEP;
    if(ambientBarToggle===0){ playGeneralBar(GENERAL_LEAD_A, GENERAL_BASS_A); } else { playGeneralBar(GENERAL_LEAD_B, GENERAL_BASS_B); }
    ambientBarToggle = ambientBarToggle===0 ? 1 : 0;
  } else if(ambientMode==='underwater'){
    barDuration=12*UNDER_STEP;
    if(ambientBarToggle===0){ playUnderwaterBar(UNDER_LEAD_A, UNDER_BASS_A); } else { playUnderwaterBar(UNDER_LEAD_B, UNDER_BASS_B); }
    ambientBarToggle = ambientBarToggle===0 ? 1 : 0;
  } else if(ambientMode==='epic'){
    barDuration=16*EPIC_STEP;
    if(ambientBarToggle===0){ playEpicBar(EPIC_LEAD_A, EPIC_BASS_A); } else { playEpicBar(EPIC_LEAD_B, EPIC_BASS_B); }
    ambientBarToggle = ambientBarToggle===0 ? 1 : 0;
  } else {
    barDuration=16*SIXTEENTH;
    if(ambientBarToggle===0){ playOverworldBar(BAR_LEAD_A, BAR_BASS_A); } else { playOverworldBar(BAR_LEAD_B, BAR_BASS_B); }
    ambientBarToggle = ambientBarToggle===0 ? 1 : 0;
  }
  ambientTimeoutId=setTimeout(scheduleAmbient, barDuration*1000);
}
function switchAmbientMode(mode){
  if(ambientMode===mode) return;
  ambientMode=mode;
  ambientBarToggle=0;
  if(ambientTimeoutId){ clearTimeout(ambientTimeoutId); ambientTimeoutId=null; }
  if(ambientActive) scheduleAmbient();
}
function startAmbient(){
  if(ambientActive || sfxMuted) return;
  ambientActive=true;
  ambientBarToggle=0;
  scheduleAmbient();
}
function stopAmbient(){
  ambientActive=false;
  if(ambientTimeoutId){ clearTimeout(ambientTimeoutId); ambientTimeoutId=null; }
}

// ---- named sound effects, built from playTone ----
function sfxCardSelect(){ playTone(392,0,0.05,'triangle',0.06); playTone(587,0.05,0.09,'triangle',0.07); }
function sfxBack(){ playTone(330,0,0.06,'triangle',0.05); playTone(220,0.05,0.08,'triangle',0.05); }
function sfxChapterOpen(){ playTone(261.6,0,0.07,'square',0.06); playTone(392,0.06,0.07,'square',0.06); playTone(523.25,0.12,0.14,'triangle',0.08); }
function sfxTypeBlip(){ playTone(320+Math.random()*90,0,0.035,'square',0.028); }
function sfxBannerGood(){ playTone(523.25,0,0.08,'triangle',0.09); playTone(659.25,0.07,0.08,'triangle',0.09); playTone(783.99,0.14,0.16,'triangle',0.1); }
function sfxBannerBad(){ playTone(220,0,0.09,'sawtooth',0.08); playTone(164.81,0.08,0.16,'sawtooth',0.07); }
function sfxStampCheck(){ playTone(880,0,0.05,'square',0.08); playTone(1174.66,0.04,0.1,'square',0.08); }
function sfxStampX(){ playTone(180,0,0.05,'sawtooth',0.08); playTone(120,0.04,0.12,'sawtooth',0.07); }
function sfxFlashGood(){ playTone(1046.5,0,0.06,'triangle',0.08); playTone(1568,0.05,0.14,'triangle',0.08); }
function sfxFlashBad(){ playTone(200,0,0.05,'sawtooth',0.07); playTone(140,0.04,0.14,'sawtooth',0.07); }
function sfxShake(){ playTone(70,0,0.28,'sawtooth',0.06); playTone(48,0.03,0.32,'triangle',0.05); }
function sfxComplete(){
  playTone(523.25,0,0.1,'triangle',0.09); playTone(659.25,0.1,0.1,'triangle',0.09);
  playTone(783.99,0.2,0.1,'triangle',0.09); playTone(1046.5,0.3,0.3,'triangle',0.11);
}
function sfxMeter(){ playTone(440,0,0.05,'square',0.05); }

function loadStory(id){
  ensureAudioCtx();
  currentStory = STORIES.find(s=>s.id===id);
  if(!currentStory) return;
  sfxCardSelect();
  document.getElementById('menuScreen').style.display='none';
  document.getElementById('chapterScreen').style.display='none';
  document.getElementById('stageScreen').classList.add('active');
  document.getElementById('skipBtn').style.display='inline-block';
  resetStage();
  beatIdx=0;
  playBeat(0);
  updatePrevNextButtons();
}
function updatePrevNextButtons(){
  const prevBtn=document.getElementById('prevStoryBtn');
  const nextBtn=document.getElementById('nextStoryBtn');
  if(!prevBtn || !nextBtn) return;
  const ch = currentChapterId ? CHAPTERS.find(c=>c.id===currentChapterId) : null;
  if(!ch || !currentStory){
    prevBtn.style.display='none'; nextBtn.style.display='none';
    return;
  }
  prevBtn.style.display='inline-block'; nextBtn.style.display='inline-block';
  const idx = ch.storyIds.indexOf(currentStory.id);
  prevBtn.disabled = (idx<=0);
  nextBtn.disabled = (idx===-1 || idx>=ch.storyIds.length-1);
}
function prevStory(){ goToAdjacentStory(-1); }
function nextStory(){ goToAdjacentStory(1); }
function goToAdjacentStory(direction){
  if(!currentChapterId || !currentStory) return;
  const ch = CHAPTERS.find(c=>c.id===currentChapterId);
  if(!ch) return;
  const idx = ch.storyIds.indexOf(currentStory.id);
  if(idx===-1) return;
  const newIdx = idx+direction;
  if(newIdx<0 || newIdx>=ch.storyIds.length) return;
  loadStory(ch.storyIds[newIdx]);
}
function backToMenu(){
  sfxBack();
  document.getElementById('stageScreen').classList.remove('active');
  if(currentChapterId){
    openChapter(currentChapterId, true);
  } else {
    document.getElementById('menuScreen').style.display='block';
    renderChapters();
  }
}

/* ---- typewriter ---- */
function typeText(el, text, cb){
  typing=true; el.textContent=''; let i=0; clearInterval(typeTimer);
  typeTimer=setInterval(()=>{
    el.textContent+=text[i];
    if(text[i] && text[i].trim() && i%2===0) sfxTypeBlip();
    i++;
    if(i>=text.length){ clearInterval(typeTimer); typing=false; if(cb)cb(); }
  },18);
}
function finishTypeNow(el,text){ clearInterval(typeTimer); el.textContent=text; typing=false; }

/* ---- stage helper API passed into each beat's enter() ---- */
function shakeScreen(){ document.body.classList.add('shake'); setTimeout(()=>document.body.classList.remove('shake'),500); }
const S={
  mood(cls){ const bg=document.getElementById('stageBg'); bg.className='stage-bg '+cls; buildParticles(); },
  icon(slot,emoji,opts){
    opts=opts||{};
    const wrap=document.getElementById(slot==='main'?'iconMain':'iconSecondary');
    const em=document.getElementById(slot==='main'?'iconMainEmoji':'iconSecondaryEmoji');
    const lab=document.getElementById(slot==='main'?'iconMainLabel':'iconSecondaryLabel');
    em.textContent=emoji;
    wrap.className='icon-slot show'+(opts.anim?' '+opts.anim:'');
    if(opts.label){ lab.textContent=opts.label; lab.style.display='inline-block'; } else { lab.style.display='none'; }
    if(opts.anim==='punch' || opts.anim==='shatter'){ playTone(300,0,0.06,'square',0.05); }
  },
  stamp(slot,type,text){
    const el=document.getElementById(slot==='main'?'stampMain':'stampSecondary');
    el.textContent=text; el.className='stamp '+type; void el.offsetWidth; el.classList.add('show');
    if(type==='check') sfxStampCheck(); else sfxStampX();
  },
  meter(cfg){
    const box=document.getElementById('metersBox');
    box.classList.add('show');
    document.getElementById('meterTag1').textContent=cfg.tag1||'';
    document.getElementById('meterVal1').textContent=cfg.val1||'';
    document.getElementById('meterRow2').style.display=cfg.tag2?'block':'none';
    if(cfg.tag2){
      document.getElementById('meterTag2').textContent=cfg.tag2;
      document.getElementById('meterVal2').textContent=cfg.val2||'';
    }
    sfxMeter();
    setTimeout(()=>{
      document.getElementById('meterFill1').style.width=(cfg.pct1||0)+'%';
      if(cfg.tag2) document.getElementById('meterFill2').style.width=(cfg.pct2||0)+'%';
      const mark=document.getElementById('meterMark1');
      if(cfg.markPct!==undefined){ mark.style.display='block'; mark.style.left=cfg.markPct+'%'; } else { mark.style.display='none'; }
    },120);
  },
  banner(main,sub){
    const b=document.getElementById('banner');
    document.getElementById('bannerMain').textContent=main;
    document.getElementById('bannerMain').style.color='var(--danger)';
    document.getElementById('bannerSub').textContent=sub||'';
    b.classList.add('show');
    sfxBannerBad();
    setTimeout(()=>b.classList.remove('show'),1500);
  },
  formula(title,lines){
    const card=document.getElementById('formulaCard');
    document.getElementById('formulaTitle').textContent=title;
    document.getElementById('formulaTitle').style.color='var(--gold)';
    const wrap=document.getElementById('formulaLines');
    wrap.innerHTML='';
    card.classList.add('show');
    playTone(660,0,0.06,'triangle',0.06);
    lines.forEach((ln,i)=>{
      const d=document.createElement('div');
      d.className='formula-line'+(ln.cls?' '+ln.cls:'');
      d.innerHTML=ln.text;
      wrap.appendChild(d);
      setTimeout(()=>{ d.classList.add('show'); playTone(500+i*160,0,0.07,'triangle',0.06); }, 250+i*350);
    });
  },
  flash(text,color){
    const el=document.getElementById('flashTxt');
    el.textContent=text; el.style.color=color||'var(--gold)';
    el.classList.remove('fly'); void el.offsetWidth; el.classList.add('fly');
    if(color==='var(--danger)') sfxFlashBad(); else sfxFlashGood();
  },
  shake(){ shakeScreen(); sfxShake(); }
};
function buildParticles(){
  const p=document.getElementById('particles');
  p.innerHTML='';
  for(let i=0;i<14;i++){
    const s=document.createElement('span');
    s.style.left=(Math.random()*100)+'%';
    s.style.bottom='0';
    s.style.animationDuration=(3+Math.random()*3)+'s';
    s.style.animationDelay=(Math.random()*3)+'s';
    p.appendChild(s);
  }
}

function resetStage(){
  ['iconMain','iconSecondary'].forEach(id=>{ document.getElementById(id).className='icon-slot'; });
  ['stampMain','stampSecondary'].forEach(id=>{ const el=document.getElementById(id); el.className='stamp'; el.textContent=''; });
  document.getElementById('metersBox').classList.remove('show');
  document.getElementById('meterFill1').style.width='0%';
  document.getElementById('meterFill2').style.width='0%';
  document.getElementById('meterMark1').style.display='none';
  document.getElementById('formulaCard').classList.remove('show');
  document.getElementById('formulaLines').innerHTML='';
  document.getElementById('banner').classList.remove('show');
  document.getElementById('flashTxt').classList.remove('fly');
  document.getElementById('endCard').classList.remove('show');
  document.getElementById('dialogue').classList.remove('show');
}

function playBeat(i){
  if(!currentStory) return;
  if(i<0 || i>=currentStory.beats.length){ showEnd(); return; }
  const b=currentStory.beats[i];
  document.getElementById('dialogue').classList.add('show');
  document.getElementById('speaker').textContent=b.speaker;
  if(b.enter) b.enter(S);
  typeText(document.getElementById('dtext'), b.text);
}
function advance(){
  if(!currentStory) return;
  if(typing){ finishTypeNow(document.getElementById('dtext'), currentStory.beats[beatIdx].text); return; }
  beatIdx++; playBeat(beatIdx);
}
function showEnd(){
  document.getElementById('dialogue').classList.remove('show');
  document.getElementById('skipBtn').style.display='none';
  markWatched(currentStory.id);
  document.getElementById('endTitle').textContent='✓ SCENE COMPLETE';
  document.getElementById('endRule').innerHTML=currentStory.endRule;
  sfxComplete();
  setTimeout(()=>document.getElementById('endCard').classList.add('show'),300);
}
function skipToEnd(){ clearInterval(typeTimer); showEnd(); }
function restartStory(){
  sfxCardSelect();
  resetStage();
  document.getElementById('skipBtn').style.display='inline-block';
  beatIdx=0; playBeat(0);
}

document.addEventListener('keydown',(e)=>{
  if((e.code==='Space'||e.code==='Enter') && document.getElementById('stageScreen').classList.contains('active')){
    if(!document.getElementById('endCard').classList.contains('show')){ e.preventDefault(); advance(); }
  }
});
</script>
